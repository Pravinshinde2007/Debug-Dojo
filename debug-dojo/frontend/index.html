   if(S.token) headers['Authorization'] = `Bearer ${S.token}`;

   try {
     const res = await fetch('/api/submit', {
       method: 'POST',
       headers: headers,
       body: JSON.stringify({
         learner_id: learnerId,
         challenge_id: c.id,
         code: code
       })
     });
     data = await safeFetchJson(res);
     if(!res.ok || data.error || data.nonJson){ throw new Error("HTTP " + res.status); }
   } catch(apiErr){
     console.warn("Backend judge unavailable, running in in-browser sandbox:", apiErr);
     data = await runChallengeInBrowser(c, code);
     toast("⚡ Ran in In-Browser Sandbox (Zero Server Mode)");
   }

   const id = data.submission_id || ('sub_' + Date.now());
   const visibleList = data.visible || data.visible_test_results || [];
   const hiddenList = data.hidden || data.hidden_test_outcomes || [];
   const overallOutcome = data.overall_outcome || (data.passed ? 'passed' : 'wrong output');

   const sub = {
     id: id,
     ch: c.id,
     code: code,
     tags: data.mistake_tags || [],
     visible: visibleList.map(t=>({
       n: t.test_number || t.test,
       call: t.input_call || t.call,
       exp: t.expected || t.exp,
       act: t.actual || t.got,
       o: t.outcome,
       error_msg: t.error_msg,
       error_type: t.error_type,
       error_line: t.error_line
     })),
     hidden: hiddenList.map(h=>({
       n: h.test_number || h.test,
       o: h.outcome
     })),
     explain: data.explanation || "Execution finished.",
     overall: overallOutcome,
     cls: OUT[overallOutcome] || (data.passed ? 'passed' : 'wrong'),
     error_type: data.error_type,
     error_line: data.error_line,
     error_msg: data.error_msg,
     total_hints: data.total_hints || (c.diff === 'Easy' ? 5 : c.diff === 'Medium' ? 4 : 3),
     failed_test_num: data.failed_test_num,
     failed_test_call: data.failed_test_call,
     failed_test_expected: data.failed_test_expected,
     failed_test_got: data.failed_test_got,
     time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
   };

   S.subs.unshift(sub);
   S.active = id;
   S.hintsMap[id] = [];
   S.status[c.id] = data.passed ? 'solved' : 'attempted';
   S.history.unshift({ch:c.id, when:'Just now', res:overallOutcome.replace(/^./,x=>x.toUpperCase()), cls:sub.cls});
   S.tab = 'all';

   await fetchProfile();
   route();
   toast(data.passed ? "All tests passed successfully!" : "Outcome: " + overallOutcome + (data.error_line ? ` (Line ${data.error_line})` : ''));
 }catch(err){
   btn.disabled=false;
   btn.innerHTML = `${IC.play} Run Code`;
   toast("Execution status: " + err.message);
 }
}

async function requestHintLive(){
 const sub = curSub();
 if(!sub) return;
 const btn = $('#hint');
 btn.disabled = true;
 btn.textContent = "Loading Hint...";

 try{
   const headers = {'Content-Type': 'application/json'};
   if(S.token) headers['Authorization'] = `Bearer ${S.token}`;
   const res = await fetch('/api/hint', {
     method: 'POST',
     headers: headers,
     body: JSON.stringify({ submission_id: sub.id })
   });
   const data = await safeFetchJson(res);

   if(res.ok && !data.error && !data.nonJson){
     if(!S.hintsMap[sub.id]) S.hintsMap[sub.id] = [];
     const lvl = data.hint_level || data.level || (S.hintsMap[sub.id].length + 1);
     if(!S.hintsMap[sub.id].some(h=>((h.hint_level || h.level) === lvl))){
       S.hintsMap[sub.id].push({
         hint: data.hint,
         hint_type: data.hint_type || `Level ${lvl} Hint`,
         hint_level: lvl
       });
     }
     toast(`Revealed Hint ${lvl}: ${data.hint_type || 'Guidance'}`);
   } else {
     throw new Error("offline");
   }
 }catch(err){
   // Client side hint fallback
   const c = chOf(sub.ch);
   const currentHints = S.hintsMap[sub.id] || [];
   const lvl = currentHints.length + 1;
   const hintMsg = (c && c.tip) ? c.tip : "Check input boundary cases, loop conditions, and return statement types.";
   if(!S.hintsMap[sub.id]) S.hintsMap[sub.id] = [];
   S.hintsMap[sub.id].push({
     hint: hintMsg,
     hint_type: `Level ${lvl} Hint`,
     hint_level: lvl
   });
   toast(`Revealed Hint ${lvl}: Guidance`);
 }
 route();
}

async function runCustomDebugLive(){
  const isDoc = S.customMode === 'doc';
  const content = isDoc ? S.customDoc : S.customCode;
  const btn = $('#custom-run');
  if(!content.trim()){
    toast('Please enter some Python code or document text first.');
    return;
  }

  S.customRunning = true;
  if(btn){
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Running in Sandbox...';
  }

  const learnerId = (S.user && S.user.id) ? S.user.id : ((S.user && S.user.email) ? S.user.email : 'demo-learner');
  try{
    const payload = isDoc ? { document_text: content, learner_id: learnerId } : { code: content, learner_id: learnerId };
    const headers = { 'Content-Type': 'application/json' };
    if(S.token) headers['Authorization'] = `Bearer ${S.token}`;

    let data = null;
    try {
      const res = await fetch('/api/analyze-custom', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(payload)
      });
      data = await safeFetchJson(res);
      if(!res.ok || data.error || data.nonJson){ throw new Error("HTTP " + res.status); }
    } catch(apiErr){
      console.warn("Backend sandbox unavailable, running in in-browser sandbox:", apiErr);
      data = await runCustomCodeInBrowser(content);
      toast("⚡ Ran in In-Browser Sandbox (Zero Server Mode)");
    }

    S.customResult = data;
    S.customHintsShown = 1;

    if(isDoc && data.cleaned_code){
      S.customCode = data.cleaned_code;
    }

    if(data.outcome === 'not_python'){
      toast("⚠️ Non-Python document detected. We need Python code to analyze!");
    } else {
      toast(data.success ? "✓ Clean Run! No errors found." : "⚠ " + (data.error_type || "Error detected"));
    }
    await fetchProfile();
  } catch(err){
    toast("Execution status: " + err.message);
  } finally {
    S.customRunning = false;
    route();
  }
}

/* ==============================================================================
   HIGH-QUALITY 3D GRAPHIC ENGINE (Enhanced Cyber Bug & Gyroscopic Matrix)
   ============================================================================== */
const GL=(function(){
 const T=window.THREE;
 let ok=false;
 try{ if(T){const c=document.createElement('canvas'); ok=!!(c.getContext('webgl2')||c.getContext('webgl'));} }catch(e){ok=false;}
 if(!ok) return {ok:false,init(){},hero(){},sky(){},unmount(){}};
 const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const MOT=RM?0:1;
 const m={x:0,y:0,sx:0,sy:0};
 addEventListener('pointermove',e=>{m.x=e.clientX/innerWidth*2-1;m.y=-(e.clientY/innerHeight*2-1);},{passive:true});
 const kf=(dt,s)=>1-Math.exp(-dt*s);
 const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
 const ease=x=>1-Math.pow(1-x,3);
 const mkR=(canvas,pr)=>{
   const r=new T.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
   r.setPixelRatio(Math.min(window.devicePixelRatio||1,pr));
   r.setClearColor(0x000000,0);
   return r;
 };
 const circle=R=>{
   const p=[];
   for(let i=0;i<128;i++){
     const a=i/128*Math.PI*2;
     p.push(new T.Vector3(Math.cos(a)*R,Math.sin(a)*R,0));
   }
   return new T.BufferGeometry().setFromPoints(p);
 };
 const visible=el=>{const b=el.getBoundingClientRect();return !(b.bottom<-60||b.top>innerHeight+60);};
 const scenes=[];
 const disposeScene=(sc,r,canvas)=>{
  sc.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(x=>{if(x.map)x.map.dispose();x.dispose();});} });
  r.dispose(); try{r.forceContextLoss();}catch(e){} if(canvas.id!=='bg3d') canvas.remove();
 };

 /* Background particle field */
 function bg(){
  const canvas=document.getElementById('bg3d'); if(!canvas) return;
  let r; try{r=mkR(canvas,1.25);}catch(e){return;}
  const sc=new T.Scene(), cam=new T.PerspectiveCamera(55,1,.1,100); cam.position.z=14;
  const world=new T.Group(); sc.add(world);
  const N=180, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const pal=[0xa88cff,0x64d8ec,0xf8c76c,0x6fe7a9].map(h=>new T.Color(h));
  for(let i=0;i<N;i++){
   pos[i*3]=(Math.random()-.5)*46; pos[i*3+1]=(Math.random()-.5)*32; pos[i*3+2]=(Math.random()-.5)*24-4;
   const c=pal[i%4]; col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const pg=new T.BufferGeometry(); pg.setAttribute('position',new T.BufferAttribute(pos,3)); pg.setAttribute('color',new T.BufferAttribute(col,3));
  const pts=new T.Points(pg,new T.PointsMaterial({size:.095,vertexColors:true,transparent:true,opacity:.7,depthWrite:false}));
  world.add(pts);
  const size=()=>{r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();};
  size(); addEventListener('resize',size);
  scenes.push({render(dt,t){
   pts.rotation.y=t*.015*MOT;
   world.rotation.y+=((m.sx*.12)-world.rotation.y)*kf(dt,2);
   world.rotation.x+=((-m.sy*.06)-world.rotation.x)*kf(dt,2);
   r.render(sc,cam);
  }});
 }

 /* ==========================================================================
    ADORABLE 3D BUG MASCOT (Cute Chibi Debugger Bug)
    - Chubby plump rounded body with creamy tummy patch
    - Giant expressive glossy anime eyes with double sparkle glints
    - Rosy glowing blushing cheeks and sweet little smile
    - Glossy candy coral ladybug shell with cute dark polka dots
    - Springy curly antennae with glowing pastel pom-pom bobbles that jiggle
    - Translucent fluttering fairy wings with cute shimmer
    - Tiny stubby paddling paws that wiggle in the air
    - Squash-and-stretch bouncy tickle physics on click
    - Orbiting magical star motes and sparkling rings
    ========================================================================== */
 function createCuteBug(){
  const bugGroup = new T.Group();

  // Premium Cute Materials
  const skinMat = new T.MeshStandardMaterial({
    color: 0xfff6ec,
    roughness: 0.22,
    metalness: 0.02
  });

  const bellyMat = new T.MeshStandardMaterial({
    color: 0xffe2ce,
    roughness: 0.3,
    metalness: 0.0
  });

  const shellMat = new T.MeshStandardMaterial({
    color: 0xff5454,
    emissive: 0x3d0c0c,
    emissiveIntensity: 0.35,
    roughness: 0.12,
    metalness: 0.05
  });

  const spotMat = new T.MeshStandardMaterial({
    color: 0x221730,
    roughness: 0.25,
    metalness: 0.02
  });

  const eyeWhiteMat = new T.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.08,
    metalness: 0.02
  });

  const eyePupilMat = new T.MeshStandardMaterial({
    color: 0x140d22,
    roughness: 0.05,
    metalness: 0.05
  });

  const eyeGlintMat = new T.MeshBasicMaterial({
    color: 0xffffff
  });

  const blushMat = new T.MeshStandardMaterial({
    color: 0xff8ca3,
    emissive: 0xff4d73,
    emissiveIntensity: 1.1,
    roughness: 0.4,
    transparent: true,
    opacity: 0.88
  });

  const bobbleMat = new T.MeshStandardMaterial({
    color: 0xffdb60,
    emissive: 0xffa826,
    emissiveIntensity: 1.8,
    roughness: 0.15,
    metalness: 0.1
  });

  const stalkMat = new T.MeshStandardMaterial({
    color: 0x3c2a52,
    roughness: 0.3,
    metalness: 0.1
  });

  const wingMat = new T.MeshStandardMaterial({
    color: 0xb5f3ff,
    emissive: 0x5ce1ff,
    emissiveIntensity: 0.8,
    roughness: 0.1,
    transparent: true,
    opacity: 0.58,
    side: T.DoubleSide,
    depthWrite: false
  });

  const pawMat = new T.MeshStandardMaterial({
    color: 0x362447,
    roughness: 0.3,
    metalness: 0.05
  });

  // 1. Chubby Main Body / Head Base
  const bodyGeo = new T.SphereGeometry(0.72, 32, 28);
  bodyGeo.scale(1.05, 0.95, 1.08);
  const bodyMesh = new T.Mesh(bodyGeo, skinMat);
  bugGroup.add(bodyMesh);

  // Soft Chubby Belly Patch
  const bellyGeo = new T.SphereGeometry(0.52, 24, 20);
  bellyGeo.scale(0.9, 0.85, 0.4);
  const bellyMesh = new T.Mesh(bellyGeo, bellyMat);
  bellyMesh.position.set(0, -0.16, 0.58);
  bugGroup.add(bellyMesh);

  // 2. Glossy Candy Ladybug Shell on Back
  const shellGroup = new T.Group();
  shellGroup.position.set(0, 0.12, -0.22);

  const shellGeo = new T.SphereGeometry(0.78, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.56);
  shellGeo.rotateX(-Math.PI / 1.55);
  shellGeo.scale(1.04, 0.96, 1.15);
  const shellMesh = new T.Mesh(shellGeo, shellMat);
  shellGroup.add(shellMesh);

  // Shell Seam Divider
  const seamGeo = new T.CylinderGeometry(0.018, 0.018, 1.2, 8);
  seamGeo.rotateX(Math.PI / 3);
  const seamMesh = new T.Mesh(seamGeo, spotMat);
  seamMesh.position.set(0, 0.28, -0.32);
  shellGroup.add(seamMesh);

  // Polka Dots on Shell
  const dotCoords = [
    [-0.38, 0.28, -0.25, 0.12],
    [ 0.38, 0.28, -0.25, 0.12],
    [-0.52, 0.05, -0.42, 0.14],
    [ 0.52, 0.05, -0.42, 0.14],
    [-0.24, 0.42, -0.58, 0.11],
    [ 0.24, 0.42, -0.58, 0.11]
  ];
  dotCoords.forEach(([dx, dy, dz, r]) => {
    const dotMesh = new T.Mesh(new T.SphereGeometry(r, 16, 14), spotMat);
    dotMesh.position.set(dx, dy, dz);
    dotMesh.scale.set(1.0, 0.4, 1.0);
    shellGroup.add(dotMesh);
  });

  // Glowing heart badge on shell
  const heartShape = new T.Shape();
  heartShape.moveTo(0, 0.06);
  heartShape.bezierCurveTo(0, 0.1, -0.08, 0.16, -0.14, 0.16);
  heartShape.bezierCurveTo(-0.2, 0.16, -0.22, 0.08, -0.22, 0.02);
  heartShape.bezierCurveTo(-0.22, -0.08, -0.08, -0.18, 0, -0.24);
  heartShape.bezierCurveTo(0.08, -0.18, 0.22, -0.08, 0.22, 0.02);
  heartShape.bezierCurveTo(0.22, 0.08, 0.2, 0.16, 0.14, 0.16);
  heartShape.bezierCurveTo(0.08, 0.16, 0, 0.1, 0, 0.06);

  const heartGeo = new T.ShapeGeometry(heartShape);
  heartGeo.scale(0.55, 0.55, 0.55);
  heartGeo.rotateX(-Math.PI / 3);
  const heartMesh = new T.Mesh(heartGeo, new T.MeshStandardMaterial({
    color: 0xffd43f,
    emissive: 0xffb700,
    emissiveIntensity: 1.5,
    side: T.DoubleSide
  }));
  heartMesh.position.set(0, 0.52, -0.45);
  shellGroup.add(heartMesh);

  bugGroup.add(shellGroup);

  // 3. Giant Sparkling Anime Eyes
  const eyesGroup = new T.Group();
  const leftEyeGroup = new T.Group();
  const rightEyeGroup = new T.Group();

  leftEyeGroup.position.set(-0.31, 0.14, 0.62);
  rightEyeGroup.position.set(0.31, 0.14, 0.62);

  [leftEyeGroup, rightEyeGroup].forEach((eg, i) => {
    const sign = i === 0 ? -1 : 1;
    eg.rotation.y = sign * 0.18;
    eg.rotation.x = -0.06;

    // Eye Sclera (White base)
    const sclera = new T.Mesh(new T.SphereGeometry(0.23, 28, 24), eyeWhiteMat);
    sclera.scale.set(1.0, 1.15, 0.85);
    eg.add(sclera);

    // Deep Glossy Pupil
    const pupil = new T.Mesh(new T.SphereGeometry(0.16, 24, 20), eyePupilMat);
    pupil.position.set(sign * 0.02, -0.01, 0.12);
    pupil.scale.set(0.95, 1.1, 0.6);
    eg.add(pupil);

    // Primary Big Glint (Sparkling highlight)
    const glint1 = new T.Mesh(new T.SphereGeometry(0.06, 12, 12), eyeGlintMat);
    glint1.position.set(sign * 0.03 + 0.04, 0.06, 0.19);
    eg.add(glint1);

    // Secondary Sub-glint
    const glint2 = new T.Mesh(new T.SphereGeometry(0.03, 10, 10), eyeGlintMat);
    glint2.position.set(sign * 0.03 - 0.04, -0.05, 0.19);
    eg.add(glint2);

    eyesGroup.add(eg);
  });
  bugGroup.add(eyesGroup);

  // 4. Rosy Cheeks (Blushing discs)
  const blushGeo = new T.SphereGeometry(0.12, 16, 14);
  blushGeo.scale(1.2, 0.6, 0.25);
  const blushL = new T.Mesh(blushGeo, blushMat);
  blushL.position.set(-0.46, -0.06, 0.58);
  blushL.rotation.y = -0.45;
  const blushR = new T.Mesh(blushGeo, blushMat);
  blushR.position.set(0.46, -0.06, 0.58);
  blushR.rotation.y = 0.45;
  bugGroup.add(blushL, blushR);

  // 5. Cute Smile `:3` Mouth
  const smileShape = new T.TorusGeometry(0.075, 0.018, 10, 24, Math.PI * 0.85);
  smileShape.rotateZ(Math.PI * 1.08);
  const smileMesh = new T.Mesh(smileShape, pawMat);
  smileMesh.position.set(0, -0.09, 0.76);
  bugGroup.add(smileMesh);

  // 6. Curly Springy Antennae with Glowing Bobbles
  const antennae = [];
  [-1, 1].forEach(side => {
    const antGroup = new T.Group();
    antGroup.position.set(side * 0.22, 0.62, 0.28);

    const curvePoints = [
      new T.Vector3(0, 0, 0),
      new T.Vector3(side * 0.08, 0.2, 0.02),
      new T.Vector3(side * 0.22, 0.38, -0.02),
      new T.Vector3(side * 0.28, 0.52, -0.08)
    ];
    const curve = new T.CatmullRomCurve3(curvePoints);
    const stemGeo = new T.TubeGeometry(curve, 18, 0.024, 8, false);
    const stemMesh = new T.Mesh(stemGeo, stalkMat);
    antGroup.add(stemMesh);

    const bobble = new T.Mesh(new T.SphereGeometry(0.12, 20, 20), bobbleMat);
    bobble.position.copy(curvePoints[3]);
    antGroup.add(bobble);

    const aura = new T.Mesh(new T.SphereGeometry(0.15, 14, 14), new T.MeshBasicMaterial({
      color: 0xffe285,
      transparent: true,
      opacity: 0.35
    }));
    bobble.add(aura);

    bugGroup.add(antGroup);
    antennae.push({ group: antGroup, side, baseRotZ: side * 0.1 });
  });

  // 7. Shimmering Translucent Fairy Wings
  const wings = [];
  [-1, 1].forEach(side => {
    const wingGroup = new T.Group();
    wingGroup.position.set(side * 0.16, 0.35, -0.16);

    const wingShape = new T.Shape();
    wingShape.moveTo(0, 0);
    wingShape.bezierCurveTo(side * 0.3, 0.4, side * 0.8, 0.6, side * 0.75, 0.15);
    wingShape.bezierCurveTo(side * 0.7, -0.15, side * 0.3, -0.2, 0, 0);

    const wingGeo = new T.ShapeGeometry(wingShape);
    const wingMesh = new T.Mesh(wingGeo, wingMat);
    wingGroup.add(wingMesh);

    const edgeGeo = new T.EdgesGeometry(wingGeo);
    const edgeLine = new T.LineSegments(edgeGeo, new T.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.75
    }));
    wingGroup.add(edgeLine);

    wingGroup.rotation.y = side * 0.3;
    wingGroup.rotation.x = -0.2;
    bugGroup.add(wingGroup);
    wings.push({ group: wingGroup, side });
  });

  // 8. Four Cute Stubby Paddling Paws
  const paws = [];
  const pawCoords = [
    [-0.38, -0.56,  0.22,  0.35, -0.25],
    [ 0.38, -0.56,  0.22, -0.35,  0.25],
    [-0.42, -0.56, -0.24,  0.45, -0.35],
    [ 0.42, -0.56, -0.24, -0.45,  0.35]
  ];

  pawCoords.forEach(([px, py, pz, rotZ, rotY], idx) => {
    const pawGroup = new T.Group();
    pawGroup.position.set(px, py, pz);

    const pawGeo = new T.SphereGeometry(0.14, 18, 14);
    pawGeo.scale(1.0, 0.8, 1.3);
    const pawMesh = new T.Mesh(pawGeo, pawMat);
    pawMesh.rotation.z = rotZ;
    pawMesh.rotation.y = rotY;
    pawGroup.add(pawMesh);

    const pad = new T.Mesh(new T.SphereGeometry(0.065, 12, 12), blushMat);
    pad.position.set(0, -0.06, 0.04);
    pad.scale.set(1.1, 0.3, 1.1);
    pawMesh.add(pad);

    bugGroup.add(pawGroup);
    paws.push({ group: pawGroup, idx, baseRotZ: rotZ });
  });

  return {
    group: bugGroup,
    antennae,
    wings,
    paws,
    eyesGroup,
    leftEyeGroup,
    rightEyeGroup,
    update(t, dt, squish) {
      bugGroup.position.y = Math.sin(t * 2.4) * 0.12;
      bugGroup.rotation.z = Math.sin(t * 1.6) * 0.04;
      bugGroup.rotation.x = Math.sin(t * 1.8) * 0.03;

      antennae.forEach(ant => {
        ant.group.rotation.z = ant.baseRotZ + Math.sin(t * 5 + ant.side) * 0.12 + squish * ant.side * 0.4;
        ant.group.rotation.x = Math.cos(t * 4.2 + ant.side) * 0.08;
      });

      wings.forEach(w => {
        w.group.rotation.y = w.side * (0.35 + Math.sin(t * 28) * 0.42);
        w.group.rotation.z = Math.sin(t * 24) * 0.12;
      });

      paws.forEach(p => {
        p.group.rotation.x = Math.sin(t * 3.5 + p.idx * 1.5) * 0.18;
        p.group.position.y = -0.56 + Math.cos(t * 3.5 + p.idx * 1.5) * 0.03;
      });

      if (squish > 0) {
        const sY = 1.0 - squish * 0.32;
        const sXZ = 1.0 + squish * 0.22;
        bugGroup.scale.set(1.15 * sXZ, 1.15 * sY, 1.15 * sXZ);
        leftEyeGroup.scale.y = Math.max(0.2, 1.0 - squish * 0.85);
        rightEyeGroup.scale.y = Math.max(0.2, 1.0 - squish * 0.85);
      } else {
        bugGroup.scale.setScalar(1.15);
        leftEyeGroup.scale.y = 1.0;
        rightEyeGroup.scale.y = 1.0;
      }
    }
  };
 }

 /* Hero 3D Stage with Cute Bug Mascot, Fairy Halos & Sparkling Star Motes */
 function hero(el){
  if(!el) return;
  const canvas=document.createElement('canvas'); el.insertBefore(canvas,el.firstChild);
  let r; try{r=mkR(canvas,1.75);}catch(e){canvas.remove();return;}
  const sc=new T.Scene(), cam=new T.PerspectiveCamera(36,1,.1,60);
  cam.position.set(0,.4,9.2); cam.lookAt(0,0,0);

  // Studio lighting: warm key, soft violet fill, turquoise rim
  sc.add(new T.AmbientLight(0xfff0ea,.85));
  const key=new T.DirectionalLight(0xffeedd,1.5); key.position.set(3,5,6); sc.add(key);
  const rim=new T.PointLight(0x64d8ec,2.0,22); rim.position.set(-5,-2,4); sc.add(rim);
  const warm=new T.PointLight(0xff8878,1.6,18); warm.position.set(4,-3,2); sc.add(warm);

  const root=new T.Group(); sc.add(root);

  // Soft Floating Bubble / Fairy Halo Rings
  const ring1=new T.LineLoop(circle(2.6),new T.LineBasicMaterial({color:0x64d8ec,transparent:true,opacity:.5}));
  const ring2=new T.LineLoop(circle(3.1),new T.LineBasicMaterial({color:0xa88cff,transparent:true,opacity:.55}));
  const ring3=new T.LineLoop(circle(3.6),new T.LineBasicMaterial({color:0xf8c76c,transparent:true,opacity:.4}));
  ring1.rotation.x=Math.PI/3.2; ring2.rotation.y=Math.PI/4.2; ring3.rotation.z=Math.PI/5.5;
  root.add(ring1,ring2,ring3);

  // Cute Chibi Bug Instance
  const cuteBug = createCuteBug();
  cuteBug.group.scale.setScalar(1.15);
  root.add(cuteBug.group);

  // Orbiting Little Stars / Fairy Dust Pearls
  const stars = [];
  const sColors = [0xffd700, 0x64d8ec, 0xff8fa3, 0xa88cff];
  for (let i = 0; i < 4; i++) {
    const sMesh = new T.Mesh(
      new T.OctahedronGeometry(0.1, 0),
      new T.MeshStandardMaterial({ color: sColors[i], emissive: sColors[i], emissiveIntensity: 2.2 })
    );
    root.add(sMesh);
    stars.push({ mesh: sMesh, angle: (i / 4) * Math.PI * 2, radius: 2.4, speed: 0.8 + i * 0.15, tilt: i * 0.7 });
  }

  // Swirling Fairy Sparkle Motes (140 particles)
  const vCount=140, vPos=new Float32Array(vCount*3), vCol=new Float32Array(vCount*3);
  const vColors=[new T.Color(0xffdb60), new T.Color(0x64d8ec), new T.Color(0xff8ca3), new T.Color(0xa88cff)];
  for(let i=0;i<vCount;i++){
    const ang=(i/vCount)*Math.PI*4;
    const rad=1.9+Math.sin(i*0.45)*0.9;
    vPos[i*3]=Math.cos(ang)*rad;
    vPos[i*3+1]=((i/vCount)-0.5)*3.2;
    vPos[i*3+2]=Math.sin(ang)*rad;
    const col=vColors[i%4];
    vCol[i*3]=col.r; vCol[i*3+1]=col.g; vCol[i*3+2]=col.b;
  }
  const vGeo=new T.BufferGeometry();
  vGeo.setAttribute('position',new T.BufferAttribute(vPos,3));
  vGeo.setAttribute('color',new T.BufferAttribute(vCol,3));
  const vPts=new T.Points(vGeo,new T.PointsMaterial({
    size:.095,
    vertexColors:true,
    transparent:true,
    opacity:.85,
    blending:T.AdditiveBlending,
    depthWrite:false
  }));
  root.add(vPts);

  // Tickle Ripple Rings on Click
  const shockGeo=new T.RingGeometry(.2,.32,64);
  const shockMat=new T.MeshBasicMaterial({color:0xff8fa3,transparent:true,opacity:0,side:T.DoubleSide});
  const shockwave=new T.Mesh(shockGeo,shockMat);
  sc.add(shockwave);

  const shockGeo2=new T.RingGeometry(.1,.18,64);
  const shockMat2=new T.MeshBasicMaterial({color:0x64d8ec,transparent:true,opacity:0,side:T.DoubleSide});
  const shockwave2=new T.Mesh(shockGeo2,shockMat2);
  sc.add(shockwave2);

  const st={ry:.5,rx:.1,vel:0,drag:false,lx:0,ly:0,squish:0,shockScale:1};
  canvas.addEventListener('pointerdown',e=>{
    st.drag=true; st.lx=e.clientX; st.ly=e.clientY;
    st.squish=1.0; st.shockScale=.2;
    shockMat.opacity=.95; shockMat2.opacity=1.0;
    try{canvas.setPointerCapture(e.pointerId);}catch(x){}
  });
  canvas.addEventListener('pointermove',e=>{
    if(!st.drag) return;
    const dx=e.clientX-st.lx, dy=e.clientY-st.ly; st.lx=e.clientX; st.ly=e.clientY;
    st.ry+=dx*.008; st.rx=clamp(st.rx+dy*.006,-.8,.8);
  });
  canvas.addEventListener('pointerup',()=>{st.drag=false;});

  const ro=new ResizeObserver(()=>{
   const w=el.clientWidth,h=el.clientHeight; if(!w||!h) return;
   r.setSize(w,h,false); cam.aspect=w/h; cam.position.z=Math.max(9.2,3.4/(Math.tan(18*Math.PI/180)*cam.aspect)); cam.updateProjectionMatrix();
  }); ro.observe(el);

  scenes.push({temp:true,
   dispose(){ro.disconnect();disposeScene(sc,r,canvas);},
   render(dt,t){
    if(!visible(el)) return;
    if(!st.drag){ st.ry+=.22*dt*MOT; }
    root.rotation.y=st.ry+m.sx*.22; root.rotation.x=st.rx-m.sy*.1;
    ring1.rotation.z+=dt*.35*MOT; ring2.rotation.x+=dt*.28*MOT; ring3.rotation.y+=dt*.2*MOT;
    vPts.rotation.y-=dt*.4*MOT;

    // Orbiting Stars
    stars.forEach(s => {
      s.angle += dt * s.speed * MOT;
      s.mesh.position.set(
        Math.cos(s.angle) * s.radius,
        Math.sin(s.angle * 1.4) * 0.8 + Math.sin(s.tilt),
        Math.sin(s.angle) * s.radius
      );
      s.mesh.rotation.x += dt * 2.5; s.mesh.rotation.y += dt * 3.0;
    });

    // Squash & Stretch Tickle Physics
    if(st.squish>0){
      st.squish=Math.max(0,st.squish-dt*2.2);
    }
    const squishFactor = st.squish > 0 ? Math.sin(st.squish * Math.PI) * Math.exp(-st.squish * 1.5) : 0;

    // Update Cute Bug Animations
    cuteBug.update(t, dt, squishFactor);

    if(shockMat.opacity>0){
      st.shockScale+=dt*5.5;
      shockwave.scale.set(st.shockScale,st.shockScale,1);
      shockMat.opacity=Math.max(0,shockMat.opacity-dt*1.6);
      shockwave2.scale.set(st.shockScale * 0.75, st.shockScale * 0.75, 1);
      shockMat2.opacity=Math.max(0,shockMat2.opacity-dt*1.8);
    }
    r.render(sc,cam);
   }});
 }

 /* Dashboard Concept Mastery Sky Scene */
 function sky(el,data){
  if(!el) return;
  const canvas=document.createElement('canvas'); el.insertBefore(canvas,el.firstChild);
  let r; try{r=mkR(canvas,1.75);}catch(e){canvas.remove();return;}
  const sc=new T.Scene(), cam=new T.PerspectiveCamera(38,1,.1,60);
  sc.add(new T.AmbientLight(0xffe6d0,.75));
  const key=new T.DirectionalLight(0xd8ccff,1.4); key.position.set(4,7,5); sc.add(key);
  const g=new T.Group(); sc.add(g);
  const base=new T.Mesh(new T.CylinderGeometry(3.7,3.9,.22,56),new T.MeshStandardMaterial({color:0x2a2233,roughness:.8,metalness:.1})); base.position.y=-.11; g.add(base);
  const colOf=v=>v>=70?0x6fe7a9:v>=50?0xa88cff:0xf8c76c;
  const n=data.length, pillars=[];
  data.forEach((d,i)=>{
   const a=i/n*Math.PI*2, x=Math.sin(a)*2.3, z=Math.cos(a)*2.3, c=colOf(d.val);
   const geo=new T.BoxGeometry(.78,1,.78); geo.translate(0,.5,0);
   const mat=new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.16,roughness:.35,metalness:.1});
   const mesh=new T.Mesh(geo,mat); mesh.position.set(x,0,z); mesh.scale.y=Math.max(.1, d.val/100*2.8);
   g.add(mesh); pillars.push(mesh);
  });
  const ro=new ResizeObserver(()=>{
   const w=el.clientWidth,h=el.clientHeight; if(!w||!h) return;
   r.setSize(w,h,false); cam.aspect=w/h; cam.position.set(0,4.8,8.5); cam.lookAt(0,.8,0); cam.updateProjectionMatrix();
  }); ro.observe(el);

  scenes.push({temp:true,
   dispose(){ro.disconnect();disposeScene(sc,r,canvas);},
   render(dt,t){
    if(!visible(el)) return;
    g.rotation.y+=.1*dt*MOT;
    r.render(sc,cam);
   }});
 }

 function init(){
  bg();
  let last=performance.now();
  const frame=now=>{
   requestAnimationFrame(frame);
   const dt=Math.min(.05,(now-last)/1000); last=now;
   const k=kf(dt,3); m.sx+=(m.x-m.sx)*k; m.sy+=(m.y-m.sy)*k;
   for(const s of scenes) s.render(dt,performance.now()/1000);
  };
  requestAnimationFrame(frame);
 }
 function unmount(){
  for(let i=scenes.length-1;i>=0;i--){ if(scenes[i].temp){ try{scenes[i].dispose();}catch(e){} scenes.splice(i,1); } }
 }
 return {init,hero,sky,unmount};
})();

GL.init();
initAuthModal();
route();
if(isLoggedIn()){
  fetchProfile().then(()=>route());
}
