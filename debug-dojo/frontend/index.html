<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Debug Dojo — AI-Guided Coding &amp; Debugging Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js" defer></script>
<style>
:root{
  --bg:#120e17; --bg2:#191421; --card:#221b2b; --card2:#2c2338; --card-hover:#352a44; --line:#3f3450;
  --fg:#f3edfa; --muted:#b2a6c2; --faint:#7d7191;
  --violet:#a88cff; --violet-d:#7c5cf0; --cyan:#64d8ec; --green:#6fe7a9; --coral:#ff8878; --amber:#f8c76c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(1000px 500px at 80% -100px,rgba(168,140,255,.16),transparent 70%),radial-gradient(800px 400px at 0% 15%,rgba(248,199,108,.06),transparent 70%);
  background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);font-weight:700}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,14,23,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;white-space:nowrap}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--violet-d),#5236b8);display:grid;place-items:center;color:#fff;box-shadow:0 0 14px rgba(124,92,240,.4)}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links a{padding:8px 13px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;transition:color .15s,background .15s}
.links a:hover{color:var(--fg);background:var(--card)}
.links a.on{color:var(--fg);background:var(--card2);font-weight:600}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid rgba(111,231,169,.4);color:var(--green);background:rgba(111,231,169,.09);white-space:nowrap;font-weight:600}
.live-pill i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;text-decoration:none;transition:all .18s ease}
.btn:hover{background:var(--card2);border-color:#5c4d72;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--violet-d),#8d6ff8);border-color:var(--violet-d);color:#fff;box-shadow:0 4px 14px rgba(124,92,240,.35)}
.btn.primary:hover{background:linear-gradient(135deg,#8d6ff8,#9e85ff);box-shadow:0 6px 18px rgba(124,92,240,.5)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}

/* generic */
.view{padding-block:36px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.grid{display:grid;gap:18px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.easy{color:var(--green);border-color:rgba(111,231,169,.35);background:rgba(111,231,169,.08)}
.pill.medium{color:var(--amber);border-color:rgba(248,199,108,.35);background:rgba(248,199,108,.08)}
.pill.hard{color:var(--coral);border-color:rgba(255,136,120,.35);background:rgba(255,136,120,.08)}
.pill.tag{color:var(--cyan);border-color:rgba(100,216,236,.3);background:rgba(100,216,236,.06)}
.pill.mistake{color:var(--coral);border-color:rgba(255,136,120,.4);background:rgba(255,136,120,.1);font-family:var(--mono);font-weight:600}
.o{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;font-family:var(--mono);white-space:nowrap}
.o.passed{background:rgba(111,231,169,.15);color:var(--green);border:1px solid rgba(111,231,169,.3)}
.o.wrong{background:rgba(255,136,120,.15);color:var(--coral);border:1px solid rgba(255,136,120,.3)}
.o.runtime{background:rgba(248,199,108,.15);color:var(--amber);border:1px solid rgba(248,199,108,.3)}
.o.timeout{background:rgba(100,216,236,.15);color:var(--cyan);border:1px solid rgba(100,216,236,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet-d),var(--violet))}

/* landing hero */
.hero{padding-block:52px 40px;display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.hero h1{font-size:clamp(38px,5.2vw,66px);margin:14px 0 20px}
.hero h1 em{font-style:normal;color:var(--violet);background:linear-gradient(135deg,var(--violet),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p.lead{font-size:18px;color:var(--muted);max-width:540px;line-height:1.65}
.hero .row{margin-top:28px}
.preview{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.preview-top{display:flex;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.preview-top i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.preview-top span{margin-left:8px;font-size:12px;color:var(--faint);font-family:var(--mono)}
.preview pre{margin:0;padding:16px;font-family:var(--mono);font-size:13px;line-height:1.7;overflow-x:auto}
.preview .ln{color:var(--faint);user-select:none;display:inline-block;width:22px}
.preview .bug{background:rgba(255,136,120,.14);display:block;margin:0 -16px;padding:0 16px;border-left:2px solid var(--coral)}
.preview-coach{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:8px;font-size:13.5px}
.k{color:#c9a8ff}.f{color:var(--cyan)}.n{color:var(--amber)}
.feat{grid-template-columns:repeat(4,1fr)}
.feat .card h3{font-size:18px;margin:12px 0 6px}
.feat .card p{color:var(--muted);font-size:14px;line-height:1.6}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line)}
.ico svg{width:22px;height:22px}
.section{margin-top:72px}
.section>h2{font-size:clamp(26px,3.4vw,38px);margin:8px 0 22px}
.steps{grid-template-columns:repeat(4,1fr)}
.step{border-top:2px solid var(--violet-d);padding-top:16px}
.step b{font-family:var(--display);font-size:18px;display:block;margin-bottom:6px}
.step p{color:var(--muted);font-size:14px;line-height:1.55}
footer{margin-top:80px;border-top:1px solid var(--line);padding-block:30px 44px;color:var(--muted);font-size:13.5px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}

/* challenge explorer UI */
.page-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:20px}
.page-head h1{font-size:clamp(28px,4vw,38px)}

/* Single-line highlighted sorting & filter toolbar */
.filters-toolbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(28,20,44,.95),rgba(17,14,26,.95));border:1px solid rgba(168,140,255,.3);box-shadow:0 8px 30px -8px rgba(124,92,240,.25);border-radius:14px;padding:10px 16px;margin-bottom:24px;flex-wrap:wrap}
.search-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;transition:all .15s ease}
.search-wrap:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,140,255,.18)}
.search-wrap .search-icon{font-size:14px;opacity:.7}
.search-wrap .search-input{width:100%;background:transparent;border:0;color:var(--fg);font:inherit;font-size:13.5px;padding:9px 0;outline:none}
.search-wrap .search-input::placeholder{color:var(--faint)}

.selects-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.select-control{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px 10px;transition:all .15s ease}
.select-control:focus-within{border-color:var(--violet)}
.select-control label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;white-space:nowrap}
.custom-select{background:transparent;border:0;color:var(--fg);font:inherit;font-size:13px;font-weight:500;outline:none;cursor:pointer;padding:6px 2px}
.custom-select option{background:#1a1426;color:#efe9f5}

/* Highlighted Sort Part in one line */
.select-control.sort-highlight{background:linear-gradient(135deg,rgba(124,92,240,.22),rgba(100,216,236,.12));border:1.5px solid var(--violet);box-shadow:0 0 16px rgba(124,92,240,.35)}
.select-control.sort-highlight label{color:var(--cyan);font-weight:700}
.select-control.sort-highlight .custom-select{color:#fff;font-weight:700}

.cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.ch{background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:hidden;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);transition:all .2s ease}
.ch:hover{border-color:var(--violet);box-shadow:0 16px 36px -12px rgba(124,92,240,.3);transform:translateY(-2px)}
.ch h3{font-size:19px;letter-spacing:-.01em}
.ch-statement{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#ded5e8;overflow-wrap:break-word;word-break:normal;flex:1}
.ch-sig{font-family:var(--mono);font-size:12px;color:var(--cyan);background:rgba(100,216,236,.08);border:1px solid rgba(100,216,236,.22);border-radius:6px;padding:4px 9px;display:inline-block;overflow-wrap:break-word;word-break:break-all}
.ch .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.status{font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.solved i{background:var(--green);box-shadow:0 0 6px var(--green)}.status.attempted i{background:var(--amber)}
.rec{font-size:12px;color:var(--violet);font-weight:700;display:inline-flex;align-items:center;gap:4px}

/* simplified workspace */
.ws{display:grid;grid-template-columns:minmax(380px,460px) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden;box-shadow:0 10px 30px -15px rgba(0,0,0,.5)}
.panel-h{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.01)}
.panel-b{padding:18px;display:grid;gap:14px}
.ws-statement{background:linear-gradient(135deg,rgba(168,140,255,.08),rgba(100,216,236,.03));border:1px solid rgba(168,140,255,.2);border-left:4px solid var(--violet);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.65;color:#efe9f5;overflow-wrap:break-word;word-break:normal}
.sig{font-family:var(--mono);font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;color:var(--cyan)}
.rules-list{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--muted);line-height:1.55}
.sample{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;display:grid;gap:6px}
.sample-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.05)}
.sample-row:last-child{border-bottom:0;padding-bottom:0}
.coach-box{background:linear-gradient(180deg,rgba(124,92,240,.07),rgba(20,16,31,.5));border:1px solid rgba(168,140,255,.22);border-radius:12px;padding:14px;display:grid;gap:10px}
.hint{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg2);display:grid;gap:4px}
.hint b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
.hint p{font-size:13.5px;line-height:1.55;color:#efe9f5}
.editor{display:grid;grid-template-columns:44px 1fr;background:var(--bg2);height:360px;overflow:hidden;position:relative}
.gutter{font-family:var(--mono);font-size:13.5px;line-height:22px;color:var(--faint);text-align:right;padding:14px 8px 14px 0;overflow:hidden;white-space:pre;border-right:1px solid var(--line);user-select:none}
.editor textarea{font-family:var(--mono);font-size:13.5px;line-height:22px;color:var(--fg);background:transparent;border:0;resize:none;outline:0;padding:14px;white-space:pre;overflow:auto;tab-size:4;width:100%;height:100%}
.tab{border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;transition:all .15s;cursor:pointer}
.tab.on{background:var(--card2);color:var(--fg)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:9px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;vertical-align:top}
td.num{color:var(--faint)}
tr:last-child td{border-bottom:0}
.hidden-list{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.hid{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
.empty{padding:20px 16px;color:var(--muted);font-size:13.5px}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.banner.ok{background:rgba(111,231,169,.12);border:1px solid rgba(111,231,169,.35);color:var(--green)}
.banner.bad{background:rgba(255,136,120,.12);border:1px solid rgba(255,136,120,.35);color:var(--coral)}

/* results & dashboard */
.sumgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:32px;line-height:1}
.stat span{color:var(--muted);font-size:13px}
.two{grid-template-columns:1.2fr 1fr}
.bars{display:grid;gap:14px}
.bars .line{display:grid;gap:5px}
.bars .line div.top{display:flex;justify-content:space-between;font-size:14px}
.rm{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.rm:last-child{border-bottom:0}
.reco{border-color:rgba(168,140,255,.5);background:linear-gradient(180deg,rgba(124,92,240,.18),var(--card))}
.how{display:grid;gap:0;max-width:780px}
.how .it{display:grid;grid-template-columns:46px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.how .it .no{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:14px;color:var(--violet)}
.how h3{font-size:19px;margin-bottom:4px}
.how p{color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;box-shadow:0 12px 30px rgba(0,0,0,.7)}

@media (max-width:1150px){
  .ws{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ws .coach-p{grid-column:1/-1}
}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-block:32px 24px}
  .feat,.steps{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .ws{grid-template-columns:minmax(0,1fr)}
  .nav-in{flex-wrap:wrap;height:auto;padding-block:10px;gap:8px 14px}
  .links{margin-left:0;order:3;width:100%}
  .live-pill{margin-left:auto}
}
@media (max-width:520px){
  .feat,.steps{grid-template-columns:1fr}
  .chips small{width:100%}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 3D visual layer ---------- */
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body>.wrap{position:relative;z-index:1}
#app{perspective:1600px;overflow-x:clip}
@keyframes rise{from{opacity:.5;transform:translateY(16px) rotateX(6deg)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
#app.enter>*:nth-child(2){animation-delay:.06s}
#app.enter>*:nth-child(3){animation-delay:.12s}
#app.enter>*:nth-child(n+4){animation-delay:.18s}

.tilt{position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .15s,background .15s}
.tilt:hover{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);transition-duration:.12s,.15s,.15s;will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),rgba(168,140,255,.18),transparent 70%)}
.tilt:hover::after{opacity:1}

.stage{position:relative;min-height:520px;border-radius:28px;display:grid;place-items:center;background:radial-gradient(closest-side,rgba(124,92,240,.24),transparent 78%)}
.stage canvas,.sky canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y;outline:0}
.stage canvas:active,.sky canvas:active{cursor:grabbing}
.stage-legend{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:8px 18px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);pointer-events:none;padding-inline:8px;font-weight:500}
.stage-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.stage-hint{position:absolute;top:10px;right:14px;font-size:12px;color:var(--faint);pointer-events:none;z-index:1;background:rgba(25,20,33,.75);backdrop-filter:blur(6px);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08)}

.deck .preview{box-shadow:0 50px 80px -34px rgba(0,0,0,.8),0 0 0 1px rgba(168,140,255,.09)}
.fl{position:absolute;padding:9px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;box-shadow:0 22px 34px -14px rgba(0,0,0,.7);white-space:nowrap;font-weight:500}

.fl.b{top:46%;right:4%;transform:translateZ(60px)}
.fl.c{bottom:-20px;left:4%;transform:translateZ(100px)}
.fl.d{top:-20px;left:4%;transform:translateZ(50px)}

.sky{position:relative;height:320px;margin-bottom:16px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(closest-side at 50% 62%,rgba(124,92,240,.24),transparent 78%),var(--bg2)}

async function safeFetchJson(res) {
  let text = '';
  try {
    text = await res.text();
  } catch (readErr) {
    return { ok: false, status: 0, detail: 'Failed to read response from server' };
  }
  if (!text || !text.trim()) {
    return { ok: res.ok, status: res.status, detail: res.ok ? '' : `Server returned empty response (${res.status})` };
  }
  try {
    const json = JSON.parse(text);
    return { ok: res.ok, status: res.status, ...json };
  } catch (parseErr) {
    return {
      ok: false,
      status: res.status,
      error: true,
      nonJson: true,
      detail: (text.length < 150 && !text.includes('<html') && !text.includes('<!DOCTYPE')) ? text : `Server is currently offline or unreachable (HTTP ${res.status})`
    };
  }
}

function getLocalAccounts(){
  try {
    return JSON.parse(localStorage.getItem('debug_dojo_local_accounts') || '[]');
  } catch(e){
    return [];
  }
}

function saveLocalAccount(acc){
  try {
    const list = getLocalAccounts();
    const idx = list.findIndex(a => a.email && a.email.toLowerCase() === acc.email.toLowerCase());
    if(idx >= 0){
      list[idx] = { ...list[idx], ...acc };
    } else {
      list.push(acc);
    }
    localStorage.setItem('debug_dojo_local_accounts', JSON.stringify(list));
  } catch(e){}
}

function createLocalJwt(user){
  const payload = {
    sub: user.id || user.email,
    email: user.email,
    name: user.name,
    exp: Math.floor(Date.now() / 1000) + (7 * 24 * 3600),
    mode: 'in_browser'
  };
  try {
    return 'local_jwt.' + btoa(unescape(encodeURIComponent(JSON.stringify(payload)))) + '.client_sig';
  } catch(e){
    return 'local_jwt.' + btoa(JSON.stringify({ sub: user.email, email: user.email, name: user.name })) + '.client_sig';
  }
}

async function fetchProfile(){
  const learnerId = (S.user && S.user.id) ? S.user.id : ((S.user && S.user.email) ? S.user.email : 'demo-learner');
  let fetchedFromBackend = false;
  try{
    const headers = {};
    if(S.token) headers['Authorization'] = `Bearer ${S.token}`;
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 3500);
    const res = await fetch(`/api/learner/${encodeURIComponent(learnerId)}`, { headers, signal: controller.signal });
    clearTimeout(tid);
    if(res.ok){
      const data = await safeFetchJson(res);
      if(data && !data.error && !data.nonJson){
        fetchedFromBackend = true;
        S.mastery = data.mastery_per_concept || S.mastery;
        S.streak = data.streak_days || S.streak || 1;
        S.recurringList = data.recurring_mistakes || [];
        S.recommendedChallenge = data.recommended_next_challenge || data.next_challenge || null;
        S.recommendationReason = data.recommendation_reason || data.reason || "";
        S.challenges_attempted = data.challenges_attempted != null ? data.challenges_attempted : 0;
        S.challenges_solved = data.challenges_solved != null ? data.challenges_solved : 0;
        S.challenges_failed = data.challenges_failed != null ? data.challenges_failed : 0;
        S.custom_debug_count = data.custom_debug_count != null ? data.custom_debug_count : 0;
        S.total_interactions = data.total_interactions != null ? data.total_interactions : 0;
        S.total_submissions = data.total_submissions != null ? data.total_submissions : 0;
        S.overall_mastery = data.overall_mastery != null ? data.overall_mastery : 50;
        S.user_history = data.history || [];

        // Update S.status accurately from real SQLite database history
        CH.forEach(c => { S.status[c.id] = 'new'; });
        if(data.history && data.history.length){
          data.history.forEach(h => {
            if(h.challenge_id && h.challenge_id !== 'custom-code'){
              if(h.passed) S.status[h.challenge_id] = 'solved';
              else if(S.status[h.challenge_id] !== 'solved') S.status[h.challenge_id] = 'attempted';
            }
          });
        }
      }
    }
  }catch(e){
    console.warn("Could not fetch profile from backend:", e);
  }

  // Calculate stats from local submissions in offline/in-browser mode
  if (!fetchedFromBackend) {
    try {
      const userEmail = (S.user && S.user.email) ? S.user.email.toLowerCase() : 'student@debugdojo.dev';
      const allSubs = JSON.parse(localStorage.getItem('debug_dojo_client_subs') || '[]');
      const userSubs = allSubs.filter(s => !s.learner_id || s.learner_id === learnerId || (s.email && s.email.toLowerCase() === userEmail));
      
      const attemptedSet = new Set();
      const solvedSet = new Set();
      let customCount = 0;

      CH.forEach(c => { S.status[c.id] = 'new'; });

      userSubs.forEach(s => {
        if(s.challenge_id === 'custom-code'){
          customCount++;
        } else if(s.challenge_id) {
          attemptedSet.add(s.challenge_id);
          if(s.passed){
            solvedSet.add(s.challenge_id);
            S.status[s.challenge_id] = 'solved';
          } else if(S.status[s.challenge_id] !== 'solved'){
            S.status[s.challenge_id] = 'attempted';
          }
        }
      });

      const attempted = attemptedSet.size;
      const solved = solvedSet.size;
      const failed = Math.max(0, attempted - solved);

      S.challenges_attempted = attempted;
      S.challenges_solved = solved;
      S.challenges_failed = failed;
      S.custom_debug_count = customCount;
      S.total_submissions = userSubs.length;
      S.total_interactions = userSubs.length;
      S.user_history = userSubs.map(s => ({
        challenge_id: s.challenge_id,
        passed: !!s.passed,
        created_at: s.created_at || s.timestamp || 'Recent',
        error_type: s.error_type || (s.passed ? null : 'Failed Test'),
        outcome: s.outcome || (s.passed ? 'passed' : 'wrong output')
      }));

      // Calculate concept mastery
      CONCEPTS.forEach(k => {
        const matching = CH.filter(c => c.concept === k);
        const solvedInConcept = matching.filter(c => solvedSet.has(c.id)).length;
        if(matching.length > 0){
          S.mastery[k] = Math.min(100, Math.round(30 + (solvedInConcept / matching.length) * 70));
        }
      });
      S.overall_mastery = overall();
    } catch(err){
      console.warn("Error computing local profile:", err);
    }
  }
}

const overall=()=>Math.round(CONCEPTS.reduce((a,k)=>a+(S.mastery[k]||50),0)/CONCEPTS.length);

const ROUTES=['home','challenges','workspace','results','dashboard','how','custom-debug','auth','analyzer'];
function route(force){
  if(!isLoggedIn()){
    const navLinks = $('#links');
    if(navLinks) navLinks.style.display = 'none';
    GL.unmount();
    const app = $('#app');
    app.innerHTML = vAuthPortal();
    bindAuthPortal();
    renderAuthNav();
    window.scrollTo(0,0);
    return;
  }

  const navLinks = $('#links');
  if(navLinks) navLinks.style.display = 'flex';

  let r=(location.hash||'#home').slice(1);
  if(!ROUTES.includes(r) || r === 'auth') r='home';
  document.querySelectorAll('#links a').forEach(a=>a.classList.toggle('on',a.dataset.r===r||(r==='workspace'&&a.dataset.r==='challenges')||(r==='results'&&a.dataset.r==='dashboard')||(r==='analyzer'&&a.dataset.r==='analyzer')));
  const v={home:vHome,challenges:vChallenges,workspace:vWorkspace,results:vResults,dashboard:vDashboard,how:vHow,'custom-debug':vCustomDebug,auth:vAuthPortal,analyzer:vAnalyzer}[r];
  const changed=!!force||r!==S.lastRoute; S.lastRoute=r;
  GL.unmount();
  const app=$('#app'), sy=window.scrollY;
  app.innerHTML=v();
  clearTimeout(S.enterT);
  if(changed){ app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); S.enterT=setTimeout(()=>app.classList.remove('enter'),900); window.scrollTo(0,0); }
  else { app.classList.remove('enter'); window.scrollTo(0,sy); }
  bind(r);
  renderAuthNav();
  if(r==='home') GL.hero($('#stage'));
  if(r==='dashboard') GL.sky($('#sky'),CONCEPTS.map(k=>({name:k,val:S.mastery[k]||50})));
}
window.addEventListener('hashchange',()=>route());
function go(r){ if(location.hash==='#'+r) route(true); else location.hash=r; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200); }

function vChallenges(){

   (f.diff==='All'||c.diff===f.diff)&&(f.concept==='All'||c.concepts.includes(f.concept))&&
   (f.status==='All'||(f.status==='Not started'?S.status[c.id]==='new':f.status==='In progress'?S.status[c.id]==='attempted':S.status[c.id]==='solved'))&&
   (!f.q||(c.title+' '+c.short+' '+c.concepts.join(' ')).toLowerCase().includes(f.q.toLowerCase())));

 if(f.sort === 'easy-first'){
   const diffOrder = { 'Easy': 1, 'Medium': 2, 'Hard': 3 };
   list.sort((a,b) => (diffOrder[a.diff]||2) - (diffOrder[b.diff]||2));

    </div>

    <div class="ws-statement" style="font-size:14px;line-height:1.6">
     ${c.desc}

    <div>

function consoleBody(c,sub){
 if(!sub) return `<div class="empty" style="padding:24px;text-align:center;color:var(--muted)">Click <b>Run Code</b> above to execute your solution against ${c.visible.length} visible and ${c.hidden} hidden test cases.</div>`;
 const vis=sub.visible||[], hid=sub.hidden||[];
 const vp=vis.filter(t=>t.o==='passed').length;
 const hp=hid.filter(h=>h.o==='passed').length;

 const banner = `<div style="padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.02)">
   <span>Visible: <b style="color:${vp===vis.length?'var(--green)':'var(--coral)'}">${vp}/${vis.length} passed</b> · Hidden: <b style="color:${hp===hid.length?'var(--green)':'var(--coral)'}">${hp}/${hid.length} passed</b></span>
   <span class="o ${sub.cls}">${(sub.overall || '').toUpperCase()}</span>
 </div>`;

 const rows=l=>l.length?`<div class="tbl"><table><thead><tr><th>Test</th><th>Input</th><th>Expected</th><th>Actual Output</th><th>Status</th></tr></thead><tbody>${l.map(t=>`<tr><td class="num">#${t.n}</td><td><code>${esc(t.call)}</code></td><td style="color:var(--cyan)"><code>${esc(t.exp)}</code></td><td><code>${esc(t.act)}</code></td><td><span class="o ${OUT[t.o]||'passed'}">${t.o}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">All visible sample tests passed! The failure occurred on a hidden edge case.</div>';
 const hidChips=l=>`<div class="hidden-list" style="padding:14px">${l.map(h=>`<div class="hid"><span class="mono muted">Hidden #${h.n}</span><span class="o ${OUT[h.o]||'passed'}">${h.o}</span></div>`).join('')}</div><div class="empty" style="padding:0 14px 14px;font-size:12px;color:var(--faint)">Hidden tests are evaluated securely in the sandbox to verify edge cases without spoiling test cases.</div>`;

 if(S.tab==='all') return banner + rows(vis) + hidChips(hid);
 if(S.tab==='passed') return banner + rows(vis.filter(t=>t.o==='passed')) + hidChips(hid.filter(h=>h.o==='passed'));
 if(S.tab==='failed'){
   const fVis = vis.filter(t=>t.o!=='passed');
   const fHid = hid.filter(h=>h.o!=='passed');
   return banner + (fVis.length?rows(fVis):`<div class="empty" style="padding:16px"><b>✓ All ${vis.length} visible sample tests passed!</b><br><span class="muted" style="font-size:13px">The failure occurred on hidden boundary/edge-case tests below. Check the Debug Coach on the left for guidance.</span></div>`) + hidChips(fHid);
 }
 return banner + hidChips(hid);
}

function renderCustomConsole(res){
  if(!res){

  if(res.stdout && res.stdout.trim()){
    out += esc(res.stdout);
  } else {
    out += '<span style="color:var(--faint)">[Process finished with no printed stdout]</span>';
  }
  if(!res.success && res.error_type){
    out += '\n<span style="color:var(--coral)">' + esc(res.error_type + (res.error_line ? ' on line ' + res.error_line : '') + (res.error_msg ? ': ' + res.error_msg : '')) + '</span>';

  return out;
}

function updateCustomTypingAssistant(code, errorLine){
  const msgEl = $('#custom-typing-msg');
  if(!msgEl) return;

  if(!code.trim()){
    msgEl.innerHTML = 'Editor is empty. Paste or write Python code to analyze.';
    return;
  }

  // 1. Check bracket/parenthesis balancing
  const stack = [];
  const pairs = { '(': ')', '[': ']', '{': '}' };
  let bracketErr = null;
  const lines = code.split('\n');

  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    const codePart = line.split('#')[0];
    for(let j = 0; j < codePart.length; j++){
      const ch = codePart[j];
      if(ch === '(' || ch === '[' || ch === '{'){
        stack.push({ ch, line: i + 1 });
      } else if(ch === ')' || ch === ']' || ch === '}'){
        if(!stack.length){
          bracketErr = `Unmatched closing '${ch}' on line ${i + 1}`;
          break;
        }
        const last = stack.pop();
        if(pairs[last.ch] !== ch){
          bracketErr = `Mismatched '${last.ch}' (line ${last.line}) with '${ch}' on line ${i + 1}`;
          break;
        }
      }
    }
    if(bracketErr) break;
  }
  if(!bracketErr && stack.length){
    const last = stack[stack.length - 1];
    bracketErr = `Unclosed '${last.ch}' starting on line ${last.line}`;
  }

  if(bracketErr){
    msgEl.innerHTML = `<span style="color:var(--coral)">⚠ ${bracketErr}</span>`;
    return;
  }

  // 2. Check for missing colon on statements
  for(let i = 0; i < lines.length; i++){
    const trimmed = lines[i].split('#')[0].trim();
    if(trimmed.match(/^(def |class |if |elif |else:|for |while |try:|except|finally:)/)){
      if(!trimmed.endsWith(':') && !trimmed.endsWith('\\') && !trimmed.endsWith('(') && !trimmed.endsWith('[')){
        msgEl.innerHTML = `<span style="color:var(--amber)">Tip: Line ${i + 1} looks like a control statement or function definition but doesn't end with a colon ':'</span>`;
        return;
      }
    }
  }

  // 3. If previous error on errorLine, check if user edited it
  if(errorLine && lines.length >= errorLine){
    msgEl.innerHTML = `<span style="color:var(--cyan)">✓ Syntax balance OK. Ready to test changes on Line ${errorLine}! Hit "Analyze &amp; Run Code".</span>`;
    return;
  }

  msgEl.innerHTML = `<span style="color:var(--green)">✓ Syntax structure and bracket balance look clean.</span>`;
}

              </div>
            </section>
          ` : ''}
        </div>
      </div>
    `}
  </div>
  `;
}

function bindAnalyzer(){
  // Mode switchers
  const swCurated = $('#switch-mode-curated') || $('#mode-curated-btn');
  if(swCurated){
    swCurated.addEventListener('click', ()=>{
      S.practiceMode = 'curated';
      go('workspace');
    });
  }
  const swAnalyzer = $('#switch-mode-analyzer') || $('#mode-analyzer-btn');
  if(swAnalyzer){
    swAnalyzer.addEventListener('click', ()=>{
      S.practiceMode = 'analyzer';
      go('analyzer');
    });
  }

  // Sample problem chips
  document.querySelectorAll('.sample-prob-btn').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.probIdx);
      const prob = SAMPLE_PROBLEMS[idx];
      if(prob){
        const ta = $('#analyzer-input-text');
        if(ta) ta.value = prob.text;
        S.analyzerInput = prob.text;
        const errEl = $('#analyzer-input-error');
        if(errEl) errEl.style.display = 'none';
        S.analyzerError = '';
      }
    });
  });

  // Clear button
  const clearBtn = $('#btn-analyzer-clear');
  if(clearBtn){
    clearBtn.addEventListener('click', ()=>{
      const ta = $('#analyzer-input-text');
      if(ta) ta.value = '';
      S.analyzerInput = '';
      S.analyzerError = '';
      const errEl = $('#analyzer-input-error');
      if(errEl) errEl.style.display = 'none';
    });
  }

  // Analyze problem submit button
  const analyzeBtn = $('#btn-analyzer-submit');
  if(analyzeBtn){
    analyzeBtn.addEventListener('click', async ()=>{
      const ta = $('#analyzer-input-text');
      const val = (ta ? ta.value : S.analyzerInput || '').trim();
      const errEl = $('#analyzer-input-error');

      if(!val || val.length < 10){
        S.analyzerError = 'Please enter a problem statement with at least 10 characters.';
        if(errEl){
          errEl.textContent = S.analyzerError;
          errEl.style.display = 'block';
        }
        return;
      }

      S.analyzerError = '';
      S.analyzerInput = val;
      S.analyzerLoading = true;
      route();

      try {
        const res = await fetch('/api/analyze-problem', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(S.token ? { 'Authorization': 'Bearer ' + S.token } : {})
          },
          body: JSON.stringify({
            problem_statement: val,
            user_id: S.user ? S.user.id : 'student'
          })
        });

        const data = await safeFetchJson(res);
        if(data && !data.error){
          S.analyzerSpec = data;
          S.analyzerCode = SANDBOX_TEMPLATES[S.analyzerLang || 'python'] || '';
          S.analyzerResults = null;
          S.analyzerFeedback = null;
          S.analyzerHintLevel = 1;
          S.analyzerActiveTestTab = 1;
          toast('Problem analyzed & verified! Sandbox is ready.');

          // Load previous attempt history
          try {
            const hRes = await fetch(`/api/sandbox-history?user_id=${S.user ? S.user.id : 'student'}&limit=10`);
            const hData = await safeFetchJson(hRes);
            if(hData && hData.attempts) S.analyzerHistory = hData.attempts;
          } catch(e){}
        } else {
          S.analyzerError = data?.detail || 'Failed to analyze problem statement.';
        }
      } catch(err){
        S.analyzerError = 'Network error connecting to analysis backend: ' + err.message;
      } finally {
        S.analyzerLoading = false;
        route();
      }
    });
  }

  // New problem button
  const newProbBtn = $('#btn-analyzer-new-problem');
  if(newProbBtn){
    newProbBtn.addEventListener('click', ()=>{
      S.analyzerSpec = null;
      S.analyzerResults = null;
      S.analyzerFeedback = null;
      S.analyzerError = '';
      route();
    });
  }

  // Copy sample input buttons
  document.querySelectorAll('.copy-input-btn').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const text = btn.dataset.input;
      if(navigator.clipboard && text){
        navigator.clipboard.writeText(text);
        toast('Sample input copied to clipboard!');
      }
    });
  });

  // Language selector
  const langSel = $('#analyzer-lang-select');
  if(langSel){
    langSel.addEventListener('change', ()=>{
      const prevLang = S.analyzerLang || 'python';
      const newLang = langSel.value;
      S.analyzerLang = newLang;
      // If code was default template or empty, switch to new template
      if(!S.analyzerCode || S.analyzerCode.trim() === (SANDBOX_TEMPLATES[prevLang] || '').trim()){
        S.analyzerCode = SANDBOX_TEMPLATES[newLang] || '';
      }
      route();
    });
  }

  // Reset starter code
  const resetBtn = $('#btn-sandbox-reset');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      S.analyzerCode = SANDBOX_TEMPLATES[S.analyzerLang || 'python'] || '';
      route();
      toast('Code reset to starter template.');
    });
  }

  // Code editor textarea & line numbers
  const ta = $('#analyzer-code-textarea'), g = $('#analyzer-gutter');
  if(ta && g){
    const updateGutter = ()=>{
      const total = ta.value.split('\n').length;
      g.textContent = Array.from({length: total}, (_, i) => i + 1).join('\n');
    };
    updateGutter();
    ta.addEventListener('input', ()=>{
      S.analyzerCode = ta.value;
      updateGutter();
    });
    ta.addEventListener('scroll', ()=>{ g.scrollTop = ta.scrollTop; });
    ta.addEventListener('keydown', e => {
      if(e.key === 'Tab'){
        e.preventDefault();
        const s = ta.selectionStart;
        ta.setRangeText('    ', s, ta.selectionEnd, 'end');
        S.analyzerCode = ta.value;
        updateGutter();
      }
    });
  }

  // Run button (Sample tests)
  const runBtn = $('#btn-sandbox-run');
  if(runBtn){
    runBtn.addEventListener('click', async ()=>{
      if(!S.analyzerSpec) return;
      S.analyzerRunning = true;
      route();

      try {
        const res = await fetch('/api/run-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(S.token ? { 'Authorization': 'Bearer ' + S.token } : {})
          },
          body: JSON.stringify({
            code: S.analyzerCode,
            language: S.analyzerLang || 'python',
            problem_spec: S.analyzerSpec,
            mode: 'run',
            user_id: S.user ? S.user.id : 'student'
          })
        });

        const data = await safeFetchJson(res);
        if(data && !data.error){
          S.analyzerResults = data.test_results;
          S.analyzerFeedback = data.feedback;
          S.analyzerHintLevel = 1;
          S.analyzerActiveTestTab = 1;
          if(data.test_results?.all_passed){
            toast('✓ Sample tests passed!');
          } else {
            toast('Sample tests finished. Review output below.');
          }
          // Refresh history
          try {
            const hRes = await fetch(`/api/sandbox-history?user_id=${S.user ? S.user.id : 'student'}&limit=10`);
            const hData = await safeFetchJson(hRes);
            if(hData && hData.attempts) S.analyzerHistory = hData.attempts;
          } catch(e){}
        } else {
          toast(data?.detail || 'Execution error.');
        }
      } catch(err){
        toast('Network error: ' + err.message);
      } finally {
        S.analyzerRunning = false;
        route();
      }
    });
  }

  // Submit button (All tests including hidden)
  const submitBtn = $('#btn-sandbox-submit');
  if(submitBtn){
    submitBtn.addEventListener('click', async ()=>{
      if(!S.analyzerSpec) return;
      S.analyzerSubmitting = true;
      route();

      try {
        const res = await fetch('/api/run-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(S.token ? { 'Authorization': 'Bearer ' + S.token } : {})
          },
          body: JSON.stringify({
            code: S.analyzerCode,
            language: S.analyzerLang || 'python',
            problem_spec: S.analyzerSpec,
            mode: 'submit',
            user_id: S.user ? S.user.id : 'student'
          })
        });

        const data = await safeFetchJson(res);
        if(data && !data.error){
          S.analyzerResults = data.test_results;
          S.analyzerFeedback = data.feedback;
          S.analyzerHintLevel = 1;
          S.analyzerActiveTestTab = 1;
          if(data.test_results?.all_passed){
            toast('🎉 Solved! All test cases passed.');
          } else {
            toast('Evaluated against all tests. Check feedback.');
          }
          // Refresh history
          try {
            const hRes = await fetch(`/api/sandbox-history?user_id=${S.user ? S.user.id : 'student'}&limit=10`);
            const hData = await safeFetchJson(hRes);
            if(hData && hData.attempts) S.analyzerHistory = hData.attempts;
          } catch(e){}
        } else {
          toast(data?.detail || 'Execution error.');
        }
      } catch(err){
        toast('Network error: ' + err.message);
      } finally {
        S.analyzerSubmitting = false;
        route();
      }
    });
  }

  // More Help progressive hint button
  const moreHelpBtn = $('#btn-sandbox-more-help');
  if(moreHelpBtn){
    moreHelpBtn.addEventListener('click', async ()=>{
      const nextLvl = Math.min((S.analyzerHintLevel || 1) + 1, 3);
      S.analyzerHintLevel = nextLvl;

      try {
        const res = await fetch('/api/get-feedback', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(S.token ? { 'Authorization': 'Bearer ' + S.token } : {})
          },
          body: JSON.stringify({
            code: S.analyzerCode,
            language: S.analyzerLang || 'python',
            problem_spec: S.analyzerSpec,
            test_results: S.analyzerResults,
            hint_level: nextLvl,
            user_id: S.user ? S.user.id : 'student'
          })
        });

        const data = await safeFetchJson(res);
        if(data && !data.error){
          S.analyzerFeedback = data;
          toast(`Revealed Hint Level ${nextLvl} of 3`);
        }
      } catch(e){}
      route();
    });
  }

  // Test case detail tab switching
  document.querySelectorAll('.test-tab-btn').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const tabNum = parseInt(btn.dataset.testTab);
      S.analyzerActiveTestTab = tabNum;
      route();
    });
  });
}

function bind(r){
 document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault(); S.cur=b.dataset.open; S.tab='all'; go('workspace');}));
 document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault(); go('workspace');}));
 if(r==='challenges'){
  document.querySelectorAll('select[data-f]').forEach(sel=>sel.addEventListener('change',()=>{S.filter[sel.dataset.f]=sel.value; route();}));
  document.querySelectorAll('button[data-f]').forEach(b=>b.addEventListener('click',()=>{S.filter[b.dataset.f]=b.dataset.v; route();}));
  const q=$('#q'); if(q){ q.addEventListener('input',()=>{S.filter.q=q.value; const pos=q.selectionStart; route(); const n=$('#q'); if(n){n.focus(); n.setSelectionRange(pos,pos);}}); }
 }
 if(r==='workspace'){
  const btnModeAnalyzer = $('#mode-analyzer-btn');
  if(btnModeAnalyzer){
   btnModeAnalyzer.addEventListener('click', ()=>{
     S.practiceMode = 'analyzer';
     go('analyzer');
   });
  }
  if(S.practiceMode === 'analyzer'){
   bindAnalyzer();
   return;
  }
  const ta=$('#code'), g=$('#gutter');
  const sub=curSub();
  const errLine = sub && sub.overall !== 'passed' ? sub.error_line : null;
  const lines=()=>{
    const total = ta.value.split('\n').length;
    g.innerHTML = Array.from({length:total},(_,i)=>{
      const num = i + 1;
      const isErr = errLine === num;
      return `<div style="${isErr?'color:var(--coral);font-weight:700;background:rgba(255,136,120,.22);border-radius:3px':''}">${isErr?'► ':''}${num}</div>`;
    }).join('');
  };
  lines();
  ta.addEventListener('input',()=>{S.code[S.cur]=ta.value; lines();});
  ta.addEventListener('scroll',()=>{g.scrollTop=ta.scrollTop;});
  ta.addEventListener('keydown',e=>{ if(e.key==='Tab'){e.preventDefault(); const s=ta.selectionStart; ta.setRangeText('    ',s,ta.selectionEnd,'end'); S.code[S.cur]=ta.value; lines();} });
  $('#reset').addEventListener('click',()=>{S.code[S.cur]=chOf(S.cur).starter; S.active=null; route(); toast('Code reset to starter template.');});
  document.querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click',()=>{S.active=b.dataset.sub; const s=S.subs.find(x=>x.id===S.active); if(s) S.code[S.cur]=s.code; route();}));
  $('#run').addEventListener('click',runLive);
  $('#hint').addEventListener('click',requestHintLive);
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab; route();}));
  const toggle = $('#toggle');
  if(toggle) toggle.addEventListener('click',()=>{S.consoleOpen=!S.consoleOpen; route();});
 }
 if(r==='analyzer'){
  bindAnalyzer();
 }
 if(r==='custom-debug'){
  const ta=$('#custom-code'), g=$('#custom-gutter');
  const updateGutter=()=>{
    if(g&&ta) g.textContent=Array.from({length:ta.value.split('\n').length},(_,i)=>i+1).join('\n');
  };
  updateGutter();
  updateCustomTypingAssistant(ta ? ta.value : '', S.customResult?.error_line);

  if(ta){
    ta.addEventListener('input',()=>{
      if(S.customMode==='doc') S.customDoc=ta.value;
      else S.customCode=ta.value;
      updateGutter();
      updateCustomTypingAssistant(ta.value, S.customResult?.error_line);
    });
    ta.addEventListener('scroll',()=>{ if(g) g.scrollTop=ta.scrollTop; });
    ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){
        e.preventDefault();
        const s=ta.selectionStart;
        ta.setRangeText('    ',s,ta.selectionEnd,'end');
        if(S.customMode==='doc') S.customDoc=ta.value;
        else S.customCode=ta.value;
        updateGutter();
      }
    });
  }

  const runBtn = $('#custom-run');
  if(runBtn) runBtn.addEventListener('click', runCustomDebugLive);

  const resetBtn = $('#custom-reset');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      if(S.customMode==='doc') S.customDoc='';
      else S.customCode='';
      S.customResult=null;
      S.customHintsShown=1;
      route();
      toast('Editor cleared.');
    });
  }

  const nextHintBtn = $('#custom-next-hint');
  if(nextHintBtn){
    nextHintBtn.addEventListener('click', ()=>{
      S.customHintsShown = Math.min((S.customHintsShown || 1) + 1, 4);
      route();
      toast(`Revealed Hint ${S.customHintsShown} of 4`);
    });
  }

  const modeCodeBtn = $('#mode-code');
  if(modeCodeBtn){
    modeCodeBtn.addEventListener('click', ()=>{
      S.customMode='code';
      route();
    });
  }
  const modeDocBtn = $('#mode-doc');
  if(modeDocBtn){
    modeDocBtn.addEventListener('click', ()=>{
      S.customMode='doc';
      route();
    });
  }

  document.querySelectorAll('[data-sample]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const smp = SAMPLES[b.dataset.sample];
      if(smp){
        S.customMode = 'code';
        S.customCode = smp.code;
        S.customResult = null;
        S.customHintsShown = 1;
        route();
        toast(`Loaded sample: ${smp.title}. Click "Analyze & Run" to inspect!`);
      }
    });
  });

  const fileInput = $('#custom-file-input');
  if(fileInput){
    fileInput.addEventListener('change', async e=>{
      const file = e.target.files[0];
      if(!file) return;

      // Restrict upload to only .pdf, .py, and .txt files
      if(!file.name.match(/\.(pdf|py|txt)$/i)){
        toast("Invalid file format. Only .pdf, .py, and .txt files are allowed.");
        fileInput.value = '';
        return;
      }

      toast(`Inspecting ${file.name} with Agentic AI...`);
      const formData = new FormData();
      formData.append('file', file);

      try{
        let data = null;
        let onlineSuccess = false;
        try {
          const res = await fetch('/api/upload-document', {
            method: 'POST',
            body: formData
          });
          data = await safeFetchJson(res);
          if (res.ok && !data.error && !data.nonJson) {
            onlineSuccess = true;
          }
        }catch(netErr){
          console.warn("Backend document upload unavailable, falling back to client-side reader:", netErr);
        }

        if (!onlineSuccess) {
          const lowerName = file.name.toLowerCase();
          if (lowerName.endsWith('.py') || lowerName.endsWith('.txt')) {
            const text = await file.text();
            const hasPyConstructs = /^\s*(def |class |import |from |for |while |if |print\(|return |try:|except )/m.test(text);
            if (lowerName.endsWith('.py') || hasPyConstructs) {
              data = {
                is_python: true,
                code: text,
                message: "Python code extracted successfully."
              };
            } else {
              data = {
                is_python: false,
                code: "",
                message: "We need Python code to analyze! The uploaded document does not contain any Python code. Please upload a Python file (.py) or a document containing Python code."
              };
            }
          } else {
            data = {
              is_python: false,
              code: "",
              message: "PDF parsing requires the backend server. To run in zero-server mode, please upload a .py or .txt file, or paste your code directly into the editor."
            };
          }
        }

        if(!data.is_python){
          S.customResult = {
            success: false,
            outcome: 'not_python',
            error_type: 'NonPythonDocumentError',
            error_line: null,
            error_msg: 'The uploaded file does not contain Python code.',
            explanation: data.message || "We need Python code to analyze! The uploaded document does not contain any Python code. Please upload a Python file (.py) or a document containing Python code.",
            hints: [
              "Please upload a .py file or a document containing Python code.",
              "Make sure your document includes Python functions, loops, or statements.",
              "If uploading a README or markdown, wrap your Python code in ```python ... ``` blocks.",
              "Only .pdf, .py, and .txt files containing Python code are supported."
            ],
            mistake_tags: ['non_python_document'],
            stdout: '',
            cleaned_code: ''
          };
          route();
          toast("⚠️ Document contains no Python code!");
          return;
        }

        S.customMode = 'code';
        S.customCode = data.code;
        S.customDoc = data.code;
        S.customResult = null;
        S.customHintsShown = 1;
        route();
        toast(`✓ Python code extracted from ${file.name}! Click "Analyze & Run Code" to test.`);
      }catch(err){
        toast("File upload failed: " + err.message);
      }finally{
        fileInput.value = '';
      }
    });
  }
 }
}

function initAuthModal(){
  const modal = $('#auth-modal');
  const closeBtn = $('#auth-modal-close');
  const tabLogin = $('#auth-tab-login');
  const tabReg = $('#auth-tab-register');
  const formLogin = $('#form-login');
  const formReg = $('#form-register');
  const loginErr = $('#login-error');
  const regErr = $('#reg-error');

  if(closeBtn && modal){
    closeBtn.addEventListener('click', ()=> modal.style.display = 'none');
    modal.addEventListener('click', e => {
      if(e.target === modal) modal.style.display = 'none';
    });
  }

  if(tabLogin && tabReg && formLogin && formReg){
    tabLogin.addEventListener('click', ()=>{
      tabLogin.classList.add('on');
      tabReg.classList.remove('on');
      formLogin.style.display = 'grid';
      formReg.style.display = 'none';
      if(loginErr) loginErr.style.display = 'none';
    });
    tabReg.addEventListener('click', ()=>{
      tabReg.classList.add('on');
      tabLogin.classList.remove('on');
      formReg.style.display = 'grid';
      formLogin.style.display = 'none';
      if(regErr) regErr.style.display = 'none';
    });
  }

  if(formLogin){
    formLogin.addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('#login-email').value.trim();
      const password = $('#login-password').value;
      if(loginErr) loginErr.style.display = 'none';

      try{
        let loggedIn = false;
        let data = null;
        try {
          const controller = new AbortController();
          const tid = setTimeout(() => controller.abort(), 1200);
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password }),
            signal: controller.signal
          });
          clearTimeout(tid);
          data = await safeFetchJson(res);
          if(res.ok && data.token && data.user){
            loggedIn = true;
          }
        }catch(netErr){
          console.warn("Backend auth unavailable, falling back to local login:", netErr);
        }

        if(loggedIn){
          S.user = data.user;
          S.token = data.token;
          localStorage.setItem('debug_dojo_user', JSON.stringify(data.user));
          localStorage.setItem('debug_dojo_jwt', data.token);
          if(modal) modal.style.display = 'none';
          renderAuthNav();
          toast(`Welcome back, ${data.user.name || data.user.email}!`);
          go('home');
          fetchProfile().then(() => route());
          return;
        }

   Runs code, challenges, and debugging directly in the browser with 0 servers!

let _pyodidePromise = null;
async function getPyodide(){
  if(_pyodidePromise) return _pyodidePromise;
  if(window.loadPyodide){
    try {
      _pyodidePromise = window.loadPyodide();
      return await _pyodidePromise;
    } catch(e){
      console.warn("Pyodide CDN load error:", e);
    }
  }
  return null;
}

function recordLocalSubmission(entry){
  try {
    const list = JSON.parse(localStorage.getItem('debug_dojo_client_subs') || '[]');
    const learnerId = (S.user && S.user.id) ? S.user.id : ((S.user && S.user.email) ? S.user.email : 'student@debugdojo.dev');
    const userEmail = (S.user && S.user.email) ? S.user.email : 'student@debugdojo.dev';
    const enriched = {
      learner_id: learnerId,
      email: userEmail,
      ...entry,
      timestamp: entry.timestamp || new Date().toISOString()
    };
    list.unshift(enriched);
    localStorage.setItem('debug_dojo_client_subs', JSON.stringify(list.slice(0, 100)));
  } catch(e){}
}

async function runCustomCodeInBrowser(rawCode){
  const py = await getPyodide();
  if(py){
    try {
      await py.runPythonAsync(`
import sys, io
_client_out = io.StringIO()
sys.stdout = _client_out
sys.stderr = _client_out
      `);
      await py.runPythonAsync(rawCode);
      const stdout = py.runPython("_client_out.getvalue()");
      const subEntry = {
        title: 'Custom Code',
        challenge_id: 'custom-code',
        difficulty: 'Custom',
        outcome: 'Passed',
        passed: 1,
        mistake_tags: stdout ? ['print_not_return'] : [],
        code_snippet: rawCode.slice(0, 100),
        created_at: new Date().toLocaleTimeString()
      };
      recordLocalSubmission(subEntry);
      return {
        success: true,
        outcome: 'passed',
        error_type: null,
        error_line: null,
        error_msg: null,
        explanation: 'Your code ran completely without any crashes or errors in the in-browser WebAssembly sandbox!',
        hints: [
          'Code executed successfully with zero runtime errors.',
          'Review terminal output on the left to verify your logic.',
          'You can modify the code and test again anytime.'
        ],
        mistake_tags: stdout ? ['print_not_return'] : [],
        stdout: stdout || '',
        cleaned_code: rawCode
      };
    } catch(err){
      let stdout = '';
      try { stdout = py.runPython("_client_out.getvalue()"); } catch(_){}
      const full = err.message || String(err);
      let errType = 'RuntimeError';
      let errLine = null;
      const lm = full.match(/line (\d+)/i);
      if(lm) errLine = parseInt(lm[1]);
      const tm = full.match(/([A-Z]\w+Error):/);
      if(tm) errType = tm[1];
      const lastLine = full.trim().split('\n').pop();

      let hints = [
        `Look at line ${errLine || 'where the error occurred'} in the editor.`,
        `Check variable types and values right before this line runs.`,
        `Add safe checks before calling methods or accessing elements.`
      ];
      if(errType === 'ZeroDivisionError'){
        hints = [
          'A number cannot be divided by zero.',
          `Look at line ${errLine || 1}: find where the division operator (/ or // or %) is used.`,
          'This often happens when dividing by len(my_list) when the list is empty (length 0).',
          'Add an if-check before division (e.g. if count != 0:) to handle zero safely.'
        ];
      } else if(errType === 'IndexError'){
        hints = [
          'Python lists use zero-based indexing starting at 0 up to len(items) - 1.',
          'Accessing index equal to len(items) triggers an IndexError.',
          'Use items[-1] to safely access the last item of a non-empty list.',
          'Guard against empty lists before indexing.'
        ];
      } else if(errType === 'TypeError'){
        hints = [
          'Python does not automatically convert numbers to strings when concatenating with +.',
          'Use str(variable) or f-strings (f"Value: {val}") to combine strings and numbers.',
          `Check operand types on line ${errLine || 1}.`
        ];
      } else if(errType === 'NameError'){
        hints = [
          `Check the spelling and capitalization of variable names on line ${errLine || 1}.`,
          'Python variables are case-sensitive (e.g. width vs widht).',
          'Make sure the variable is assigned before being read.'
        ];
      }

      const subEntry = {
        title: 'Custom Code',
        challenge_id: 'custom-code',
        difficulty: 'Custom',
        outcome: errType,
        passed: 0,
        mistake_tags: [],
        code_snippet: rawCode.slice(0, 100),
        created_at: new Date().toLocaleTimeString()
      };
      recordLocalSubmission(subEntry);

      return {
        success: false,
        outcome: 'runtime_error',
        error_type: errType,
        error_line: errLine,
        error_msg: lastLine,
        explanation: `Your code stopped due to ${errType} on line ${errLine || 'unknown'}: ${lastLine}`,
        hints: hints,
        mistake_tags: [],
        stdout: stdout || '',
        cleaned_code: rawCode
      };
    }
  }

  // Pure JavaScript Static Evaluator Fallback (if offline without Pyodide)
  return fallbackEvaluateCustomCodeJS(rawCode);
}

function fallbackEvaluateCustomCodeJS(rawCode){
  const lines = rawCode.split('\n');
  let errType = null, errLine = null, errDetail = '';
  for(let i=0; i<lines.length; i++){
    const l = lines[i];
    if(l.includes('/ 0') || l.includes('// 0') || l.includes('% 0') || (l.includes('/ len(') && l.includes('[]'))){
      errType = 'ZeroDivisionError'; errLine = i + 1; errDetail = 'ZeroDivisionError: division by zero'; break;
    }
    if(l.includes('[len(') && l.includes(')]')){
      errType = 'IndexError'; errLine = i + 1; errDetail = 'IndexError: list index out of range'; break;
    }
    if(l.includes('"') && l.includes('+') && (l.includes('age') || l.includes('24') || l.includes('10')) && !l.includes('str(')){
      errType = 'TypeError'; errLine = i + 1; errDetail = 'TypeError: can only concatenate str (not "int") to str'; break;
    }
    if(l.includes('widht')){
      errType = 'NameError'; errLine = i + 1; errDetail = "NameError: name 'widht' is not defined. Did you mean: 'width'?"; break;
    }
    if((l.trim().startsWith('def ') || l.trim().startsWith('if ') || l.trim().startsWith('for ') || l.trim().startsWith('while ')) && !l.trim().endsWith(':')){
      errType = 'SyntaxError'; errLine = i + 1; errDetail = "SyntaxError: expected ':'"; break;
    }
  }

  if(errType){
    return {
      success: false,
      outcome: 'runtime_error',
      error_type: errType,
      error_line: errLine,
      error_msg: errDetail,
      explanation: `Your code stopped due to ${errType} on line ${errLine}: ${errDetail}`,
      hints: [
        `Check line ${errLine} carefully in the editor.`,
        'Verify operand types, boundaries, and spelling.',
        'Apply the recommended fix and run again.'
      ],
      mistake_tags: [],
      stdout: '',
      cleaned_code: rawCode
    };
  }

  return {
    success: true,
    outcome: 'passed',
    error_type: null,
    error_line: null,
    error_msg: null,
    explanation: 'Your code ran completely without any crashes or errors in the in-browser sandbox!',
    hints: ['Execution succeeded! Check printed output to verify logic.'],
    mistake_tags: [],
    stdout: 'Execution finished successfully.\n',
    cleaned_code: rawCode
  };
}

async function runChallengeInBrowser(c, code){
  const py = await getPyodide();
  const vis = c.visible || [];
  if(py){
    try {
      await py.runPythonAsync(code);
    } catch(compErr){
      const lastLine = (compErr.message || String(compErr)).trim().split('\n').pop();
      return {
        submission_id: 'sub_client_' + Date.now(),
        passed: false,
        overall_outcome: 'runtime error',
        explanation: `Syntax or definition error: ${lastLine}`,
        error_type: 'SyntaxError',
        error_line: null,
        error_msg: lastLine,
        visible_test_results: vis.map((t, i) => ({
          test: i + 1, call: t.call, expected: String(t.exp), got: '', outcome: 'runtime_error', error_msg: lastLine
        })),
        hidden_test_outcomes: [{test: vis.length + 1, outcome: 'runtime_error'}],
        mistake_tags: []
      };
    }

    const visibleResults = [];
    let allPassed = true;
    for(let i = 0; i < vis.length; i++){
      const t = vis[i];
      try {
        const val = await py.runPythonAsync(t.call);
        const gotStr = String(val === undefined ? 'None' : val);
        const pass = gotStr === String(t.exp);
        if(!pass) allPassed = false;
        visibleResults.push({
          test: i + 1,
          call: t.call,
          expected: String(t.exp),
          got: gotStr,
          outcome: pass ? 'passed' : 'wrong output'
        });
      } catch(tErr){
        allPassed = false;
        visibleResults.push({
          test: i + 1,
          call: t.call,
          expected: String(t.exp),
          got: '',
          outcome: 'runtime_error',
          error_msg: tErr.message
        });
      }
    }

    const subEntry = {
      title: c.title,
      challenge_id: c.id,
      difficulty: c.diff,
      outcome: allPassed ? 'Passed' : 'Failed',
      passed: allPassed ? 1 : 0,
      mistake_tags: allPassed ? [] : ['unhandled_short_input'],
      code_snippet: code.slice(0, 100),
      created_at: new Date().toLocaleTimeString()
    };
    recordLocalSubmission(subEntry);

    return {
      submission_id: 'sub_client_' + Date.now(),
      passed: allPassed,
      overall_outcome: allPassed ? 'passed' : 'wrong output',
      explanation: allPassed ? 'All test cases passed cleanly in the in-browser sandbox!' : 'One or more tests failed. Check the results below.',
      visible_test_results: visibleResults,
      hidden_test_outcomes: [{test: vis.length + 1, outcome: allPassed ? 'passed' : 'wrong output'}],
      mistake_tags: allPassed ? [] : ['unhandled_short_input']
    };
  }

  // Fallback if Pyodide not available
  const subEntry = {
    title: c.title,
    challenge_id: c.id,
    difficulty: c.diff,
    outcome: 'Attempted',
    passed: 0,
    mistake_tags: [],
    code_snippet: code.slice(0, 100),
    created_at: new Date().toLocaleTimeString()
  };
  recordLocalSubmission(subEntry);
  return {
    submission_id: 'sub_client_' + Date.now(),
    passed: false,
    overall_outcome: 'wrong output',
    explanation: 'Testing in in-browser mode. Verify your boundary cases and return values.',
    visible_test_results: vis.map((t, i) => ({
      test: i + 1, call: t.call, expected: String(t.exp), got: 'None', outcome: 'wrong output'
    })),
    hidden_test_outcomes: [{test: vis.length + 1, outcome: 'wrong output'}],
    mistake_tags: []
  };
}
