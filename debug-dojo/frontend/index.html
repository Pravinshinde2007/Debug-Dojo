<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Debug Dojo — AI-Guided Coding &amp; Debugging Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#120e17; --bg2:#191421; --card:#221b2b; --card2:#2c2338; --card-hover:#352a44; --line:#3f3450;
  --fg:#f3edfa; --muted:#b2a6c2; --faint:#7d7191;
  --violet:#a88cff; --violet-d:#7c5cf0; --cyan:#64d8ec; --green:#6fe7a9; --coral:#ff8878; --amber:#f8c76c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(1000px 500px at 80% -100px,rgba(168,140,255,.16),transparent 70%),radial-gradient(800px 400px at 0% 15%,rgba(248,199,108,.06),transparent 70%);
  background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);font-weight:700}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,14,23,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;white-space:nowrap}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--violet-d),#5236b8);display:grid;place-items:center;color:#fff;box-shadow:0 0 14px rgba(124,92,240,.4)}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links a{padding:8px 13px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;transition:color .15s,background .15s}
.links a:hover{color:var(--fg);background:var(--card)}
.links a.on{color:var(--fg);background:var(--card2);font-weight:600}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid rgba(111,231,169,.4);color:var(--green);background:rgba(111,231,169,.09);white-space:nowrap;font-weight:600}
.live-pill i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;text-decoration:none;transition:all .18s ease}
.btn:hover{background:var(--card2);border-color:#5c4d72;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--violet-d),#8d6ff8);border-color:var(--violet-d);color:#fff;box-shadow:0 4px 14px rgba(124,92,240,.35)}
.btn.primary:hover{background:linear-gradient(135deg,#8d6ff8,#9e85ff);box-shadow:0 6px 18px rgba(124,92,240,.5)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}

/* generic */
.view{padding-block:36px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.grid{display:grid;gap:18px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.easy{color:var(--green);border-color:rgba(111,231,169,.35);background:rgba(111,231,169,.08)}
.pill.medium{color:var(--amber);border-color:rgba(248,199,108,.35);background:rgba(248,199,108,.08)}
.pill.hard{color:var(--coral);border-color:rgba(255,136,120,.35);background:rgba(255,136,120,.08)}
.pill.tag{color:var(--cyan);border-color:rgba(100,216,236,.3);background:rgba(100,216,236,.06)}
.pill.mistake{color:var(--coral);border-color:rgba(255,136,120,.4);background:rgba(255,136,120,.1);font-family:var(--mono);font-weight:600}
.o{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;font-family:var(--mono);white-space:nowrap}
.o.passed{background:rgba(111,231,169,.15);color:var(--green);border:1px solid rgba(111,231,169,.3)}
.o.wrong{background:rgba(255,136,120,.15);color:var(--coral);border:1px solid rgba(255,136,120,.3)}
.o.runtime{background:rgba(248,199,108,.15);color:var(--amber);border:1px solid rgba(248,199,108,.3)}
.o.timeout{background:rgba(100,216,236,.15);color:var(--cyan);border:1px solid rgba(100,216,236,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet-d),var(--violet))}

/* landing hero */
.hero{padding-block:52px 40px;display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.hero h1{font-size:clamp(38px,5.2vw,66px);margin:14px 0 20px}
.hero h1 em{font-style:normal;color:var(--violet);background:linear-gradient(135deg,var(--violet),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p.lead{font-size:18px;color:var(--muted);max-width:540px;line-height:1.65}
.hero .row{margin-top:28px}
.preview{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.preview-top{display:flex;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.preview-top i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.preview-top span{margin-left:8px;font-size:12px;color:var(--faint);font-family:var(--mono)}
.preview pre{margin:0;padding:16px;font-family:var(--mono);font-size:13px;line-height:1.7;overflow-x:auto}
.preview .ln{color:var(--faint);user-select:none;display:inline-block;width:22px}
.preview .bug{background:rgba(255,136,120,.14);display:block;margin:0 -16px;padding:0 16px;border-left:2px solid var(--coral)}
.preview-coach{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:8px;font-size:13.5px}
.k{color:#c9a8ff}.f{color:var(--cyan)}.n{color:var(--amber)}
.feat{grid-template-columns:repeat(4,1fr)}
.feat .card h3{font-size:18px;margin:12px 0 6px}
.feat .card p{color:var(--muted);font-size:14px;line-height:1.6}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line)}
.ico svg{width:22px;height:22px}
.section{margin-top:72px}
.section>h2{font-size:clamp(26px,3.4vw,38px);margin:8px 0 22px}
.steps{grid-template-columns:repeat(4,1fr)}
.step{border-top:2px solid var(--violet-d);padding-top:16px}
.step b{font-family:var(--display);font-size:18px;display:block;margin-bottom:6px}
.step p{color:var(--muted);font-size:14px;line-height:1.55}
footer{margin-top:80px;border-top:1px solid var(--line);padding-block:30px 44px;color:var(--muted);font-size:13.5px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}

/* challenge explorer UI */
.page-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:24px}
.page-head h1{font-size:clamp(28px,4vw,42px)}
.filters{display:grid;gap:14px;margin-bottom:26px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.search{width:100%;max-width:440px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 16px;color:var(--fg);font:inherit;font-size:14px}
.search::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips small{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.1em;width:82px;font-weight:600}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--muted);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500;transition:all .15s ease}
.chip:hover{color:var(--fg);border-color:#5c4d72}
.chip.on{background:var(--violet-d);border-color:var(--violet-d);color:#fff;font-weight:600}
.cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.ch{background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);transition:all .2s ease}
.ch:hover{border-color:var(--violet);box-shadow:0 16px 36px -12px rgba(124,92,240,.3);transform:translateY(-2px)}
.ch h3{font-size:20px;letter-spacing:-.01em}
.ch-statement{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:13px 15px;font-size:14px;line-height:1.65;color:#ded5e8;overflow-wrap:break-word;word-break:normal;flex:1}
.ch-sig{font-family:var(--mono);font-size:12px;color:var(--cyan);background:rgba(100,216,236,.08);border:1px solid rgba(100,216,236,.22);border-radius:6px;padding:4px 9px;display:inline-block;overflow-wrap:break-word;word-break:break-all}
.ch .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:6px}
.status{font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.solved i{background:var(--green);box-shadow:0 0 6px var(--green)}.status.attempted i{background:var(--amber)}
.rec{font-size:12px;color:var(--violet);font-weight:700;display:inline-flex;align-items:center;gap:4px}

/* workspace */
.ws{display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr) minmax(310px,390px);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden;box-shadow:0 10px 30px -15px rgba(0,0,0,.5)}
.panel-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.01)}
.panel-b{padding:18px;display:grid;gap:15px}
.desc h2{font-size:24px}
.ws-statement{background:linear-gradient(135deg,rgba(168,140,255,.09),rgba(100,216,236,.04));border:1px solid rgba(168,140,255,.25);border-left:4px solid var(--violet);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:#efe9f5;overflow-wrap:break-word;word-break:normal}
.sig{font-family:var(--mono);font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;color:var(--cyan)}
.rules-list{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--muted);line-height:1.55}
.rules-list li{overflow-wrap:break-word}
.sample{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-family:var(--mono);font-size:12.5px;display:grid;gap:7px}
.sample-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.05)}
.sample-row:last-child{border-bottom:0;padding-bottom:0}
details.more{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--bg2)}
details.more summary{cursor:pointer;font-weight:600;font-size:13.5px}
details.more p{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.55}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.editor{display:grid;grid-template-columns:46px 1fr;background:var(--bg2);height:360px;overflow:hidden;position:relative}
.gutter{font-family:var(--mono);font-size:13.5px;line-height:22px;color:var(--faint);text-align:right;padding:14px 8px 14px 0;overflow:hidden;white-space:pre;border-right:1px solid var(--line);user-select:none}
.editor textarea{font-family:var(--mono);font-size:13.5px;line-height:22px;color:var(--fg);background:transparent;border:0;resize:none;outline:0;padding:14px;white-space:pre;overflow:auto;tab-size:4;width:100%;height:100%}
.ed-bar{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);align-items:center;background:rgba(255,255,255,.01)}
.ed-bar .sp{flex:1}
.hist{padding:0 18px 16px;display:grid;gap:6px}
.hist button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;transition:border-color .15s}
.hist button:hover{border-color:#5c4d72}
.coach .msg{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.65}
.coach .note{font-size:13px;color:var(--amber);background:rgba(248,199,108,.08);border:1px solid rgba(248,199,108,.28);border-radius:10px;padding:11px 13px;line-height:1.55}
.hint{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--bg2);display:grid;gap:4px}
.hint b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
.hint p{font-size:14px;line-height:1.6}
.tip{display:flex;gap:10px;font-size:13.5px;color:var(--muted);line-height:1.55}
.tip svg{flex:none;width:18px;height:18px;color:var(--cyan);margin-top:2px}
.console{margin-top:16px}
.console-h{display:flex;align-items:center;gap:6px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(255,255,255,.01)}
.tab{border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:8px;font-size:13.5px;font-weight:600;transition:all .15s}
.tab.on{background:var(--card2);color:var(--fg)}
.console-h .sp{flex:1}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:11px 16px;border-bottom:1px solid var(--line)}
td{padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;vertical-align:top}
td.num{color:var(--faint)}
tr:last-child td{border-bottom:0}
.hidden-list{display:flex;flex-wrap:wrap;gap:8px;padding:16px}
.hid{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px}
.empty{padding:22px 18px;color:var(--muted);font-size:14px}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.banner.ok{background:rgba(111,231,169,.12);border:1px solid rgba(111,231,169,.35);color:var(--green)}
.banner.bad{background:rgba(255,136,120,.12);border:1px solid rgba(255,136,120,.35);color:var(--coral)}

/* results & dashboard */
.sumgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:32px;line-height:1}
.stat span{color:var(--muted);font-size:13px}
.two{grid-template-columns:1.2fr 1fr}
.bars{display:grid;gap:14px}
.bars .line{display:grid;gap:5px}
.bars .line div.top{display:flex;justify-content:space-between;font-size:14px}
.rm{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.rm:last-child{border-bottom:0}
.reco{border-color:rgba(168,140,255,.5);background:linear-gradient(180deg,rgba(124,92,240,.18),var(--card))}
.how{display:grid;gap:0;max-width:780px}
.how .it{display:grid;grid-template-columns:46px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.how .it .no{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:14px;color:var(--violet)}
.how h3{font-size:19px;margin-bottom:4px}
.how p{color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;box-shadow:0 12px 30px rgba(0,0,0,.7)}

@media (max-width:1150px){
  .ws{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ws .coach-p{grid-column:1/-1}
}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-block:32px 24px}
  .feat,.steps{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .ws{grid-template-columns:minmax(0,1fr)}
  .nav-in{flex-wrap:wrap;height:auto;padding-block:10px;gap:8px 14px}
  .links{margin-left:0;order:3;width:100%}
  .live-pill{margin-left:auto}
}
@media (max-width:520px){
  .feat,.steps{grid-template-columns:1fr}
  .chips small{width:100%}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 3D visual layer ---------- */
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body>.wrap{position:relative;z-index:1}
#app{perspective:1600px;overflow-x:clip}
@keyframes rise{from{opacity:.5;transform:translateY(16px) rotateX(6deg)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
#app.enter>*:nth-child(2){animation-delay:.06s}
#app.enter>*:nth-child(3){animation-delay:.12s}
#app.enter>*:nth-child(n+4){animation-delay:.18s}

.tilt{position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .15s,background .15s}
.tilt:hover{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);transition-duration:.12s,.15s,.15s;will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),rgba(168,140,255,.18),transparent 70%)}
.tilt:hover::after{opacity:1}

.stage{position:relative;min-height:520px;border-radius:28px;display:grid;place-items:center;background:radial-gradient(closest-side,rgba(124,92,240,.24),transparent 78%)}
.stage canvas,.sky canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y;outline:0}
.stage canvas:active,.sky canvas:active{cursor:grabbing}
.stage-legend{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:8px 18px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);pointer-events:none;padding-inline:8px;font-weight:500}
.stage-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.stage-hint{position:absolute;top:10px;right:14px;font-size:12px;color:var(--faint);pointer-events:none;z-index:1;background:rgba(25,20,33,.75);backdrop-filter:blur(6px);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08)}
.stage-fallback{color:var(--faint);font-size:13px;padding:20px;text-align:center}
.stage canvas~.stage-fallback{display:none}

.scene3d{perspective:1400px;display:grid;place-items:center;padding-block:34px 26px}
.deck{position:relative;width:min(760px,100%);transform-style:preserve-3d;transform:perspective(1300px) rotateX(6deg) rotateY(-8deg);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.deck:hover{transform:perspective(1300px) rotateX(calc(6deg + var(--rx,0deg))) rotateY(calc(-8deg + var(--ry,0deg)));transition-duration:.15s}
.deck::after{display:none}
.deck .preview{box-shadow:0 50px 80px -34px rgba(0,0,0,.8),0 0 0 1px rgba(168,140,255,.09)}
.fl{position:absolute;padding:9px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;box-shadow:0 22px 34px -14px rgba(0,0,0,.7);white-space:nowrap;font-weight:500}
.fl.a{top:-20px;right:5%;transform:translateZ(90px)}
.fl.b{top:46%;right:4%;transform:translateZ(60px)}
.fl.c{bottom:-20px;left:4%;transform:translateZ(100px)}
.fl.d{top:-20px;left:4%;transform:translateZ(50px)}

.sky{position:relative;height:320px;margin-bottom:16px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(closest-side at 50% 62%,rgba(124,92,240,.24),transparent 78%),var(--bg2)}

@media (max-width:860px){.stage{min-height:400px}.scene3d{padding-block:28px 22px}}
@media (max-width:520px){.fl.b,.fl.c{display:none}.stage{min-height:350px}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chOf=id=>CH.find(c=>c.id===id)||CH[0];
function getCode(id){ if(S.code[id]==null) S.code[id]=chOf(id).starter; return S.code[id]; }

async function fetchProfile(){
  try{
    const res = await fetch('/api/learner/demo-learner');
    if(res.ok){
      const data = await res.json();
      S.mastery = data.mastery_per_concept || S.mastery;
      S.streak = data.streak_days || S.streak;
      S.recurringList = data.recurring_mistakes || [];
      S.recommendedChallenge = data.recommended_next_challenge || null;
      S.recommendationReason = data.recommendation_reason || "";
      if(data.recent_submissions && data.recent_submissions.length){
        S.history = data.recent_submissions.map(s=>({
          ch: s.challenge_id,
          when: s.created_at ? s.created_at.split(' ')[1] || 'Today' : 'Today',
          res: s.overall_outcome.replace(/^./, x=>x.toUpperCase()),
          cls: OUT[s.overall_outcome] || 'passed'
        }));
      }
    }
  }catch(e){
    console.warn("Could not fetch profile:", e);
  }
}

const overall=()=>Math.round(CONCEPTS.reduce((a,k)=>a+(S.mastery[k]||50),0)/CONCEPTS.length);

/* ---------- router ---------- */
const ROUTES=['home','challenges','workspace','results','dashboard','how'];
function route(force){
  let r=(location.hash||'#home').slice(1);
  if(!ROUTES.includes(r)) r='home';
  document.querySelectorAll('#links a').forEach(a=>a.classList.toggle('on',a.dataset.r===r||(r==='workspace'&&a.dataset.r==='challenges')||(r==='results'&&a.dataset.r==='dashboard')));
  const v={home:vHome,challenges:vChallenges,workspace:vWorkspace,results:vResults,dashboard:vDashboard,how:vHow}[r];
  const changed=!!force||r!==S.lastRoute; S.lastRoute=r;
  GL.unmount();
  const app=$('#app'), sy=window.scrollY;
  app.innerHTML=v();
  clearTimeout(S.enterT);
  if(changed){ app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); S.enterT=setTimeout(()=>app.classList.remove('enter'),900); window.scrollTo(0,0); }
  else { app.classList.remove('enter'); window.scrollTo(0,sy); }
  bind(r);
  if(r==='home') GL.hero($('#stage'));
  if(r==='dashboard') GL.sky($('#sky'),CONCEPTS.map(k=>({name:k,val:S.mastery[k]||50})));
}
window.addEventListener('hashchange',()=>route());
function go(r){ if(location.hash==='#'+r) route(true); else location.hash=r; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200); }

function consoleBody(c,sub){
 if(!sub) return `<div class="empty">Results appear here after executing your code. You have ${c.visible.length} visible and ${c.hidden} hidden tests.</div>`;
 const vis=sub.visible||[], hid=sub.hidden||[];
 const vp=vis.filter(t=>t.o==='passed').length;
 const hp=hid.filter(h=>h.o==='passed').length;

 const banner = `<div style="padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.02)">
   <span>Visible: <b style="color:${vp===vis.length?'var(--green)':'var(--coral)'}">${vp}/${vis.length} passed</b> · Hidden: <b style="color:${hp===hid.length?'var(--green)':'var(--coral)'}">${hp}/${hid.length} passed</b></span>
   <span class="o ${sub.cls}">${sub.overall.toUpperCase()}</span>
 </div>`;

 const rows=l=>l.length?`<div class="tbl"><table><thead><tr><th>#</th><th>Input</th><th>Expected</th><th>Actual Returned</th><th>Outcome</th></tr></thead><tbody>${l.map(t=>`<tr><td class="num">${t.n}</td><td>${esc(t.call)}</td><td>${esc(t.exp)}</td><td>${esc(t.act)}</td><td><span class="o ${OUT[t.o]||'passed'}">${t.o}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">All visible sample tests passed! The failure occurred on a hidden edge case.</div>';
 const hidChips=l=>`<div class="hidden-list">${l.map(h=>`<div class="hid"><span class="mono muted">Hidden #${h.n}</span><span class="o ${OUT[h.o]||'passed'}">${h.o}</span></div>`).join('')}</div><div class="empty" style="padding-top:0">Confidentiality Guarantee: Hidden inputs and expected outputs are evaluated securely on the server and never sent to the browser.</div>`;

 if(S.tab==='all') return banner + rows(vis) + hidChips(hid);
 if(S.tab==='passed') return banner + rows(vis.filter(t=>t.o==='passed')) + hidChips(hid.filter(h=>h.o==='passed'));
 if(S.tab==='failed'){
   const fVis = vis.filter(t=>t.o!=='passed');
   const fHid = hid.filter(h=>h.o!=='passed');
   return banner + (fVis.length?rows(fVis):`<div class="empty"><b>✓ All ${vis.length} visible sample tests passed!</b><br><span class="muted" style="font-size:13px">Your function produced the expected results on standard sample inputs, but failed on hidden boundary/edge-case tests below (such as k=0, empty inputs, or boundary values). Read the Debug Coach on the right for guidance.</span></div>`) + hidChips(fHid);
 }
 return banner + hidChips(hid);
}

async function runLive(){
 const c=chOf(S.cur), btn=$('#run'); const code=$('#code').value; S.code[c.id]=code;
 btn.disabled=true; btn.innerHTML='<span class="spin"></span> Running in Sandbox...';

 try{
   const res = await fetch('/api/submit', {
     method: 'POST',
     headers: {'Content-Type': 'application/json'},
     body: JSON.stringify({
       learner_id: 'demo-learner',
       challenge_id: c.id,
       code: code
     })
   });

   if(!res.ok){
     throw new Error("HTTP " + res.status);
   }

   const data = await res.json();
   const id = data.submission_id;

   const sub = {
     id: id,
     ch: c.id,
     code: code,
     tags: data.mistake_tags || [],
     visible: (data.visible_test_results || []).map(t=>({n:t.test_number, call:t.input_call, exp:t.expected, act:t.actual, o:t.outcome})),
     hidden: (data.hidden_test_outcomes || []).map(h=>({n:h.test_number, o:h.outcome})),
     explain: data.explanation || "Execution finished.",
     overall: data.overall_outcome,
     cls: OUT[data.overall_outcome] || 'passed',
     time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
   };

   S.subs.unshift(sub);
   S.active = id;
   S.hintsMap[id] = [];
   S.status[c.id] = data.passed ? 'solved' : 'attempted';
   S.history.unshift({ch:c.id, when:'Just now', res:data.overall_outcome.replace(/^./,x=>x.toUpperCase()), cls:sub.cls});
   S.tab = 'all';

   fetchProfile();
   route();
   toast(data.passed ? "All tests passed successfully!" : "Outcome: " + data.overall_outcome);
 }catch(err){
   btn.disabled=false;
   btn.innerHTML = `${IC.play} Run Code`;
   toast("Failed to connect to judge: " + err.message);
 }
}

async function requestHintLive(){
 const sub = curSub();
 if(!sub) return;
 const btn = $('#hint');
 btn.disabled = true;
 btn.textContent = "Loading Hint...";

 try{
   const res = await fetch('/api/hint', {
     method: 'POST',
     headers: {'Content-Type': 'application/json'},
     body: JSON.stringify({ submission_id: sub.id })
   });

   if(res.ok){
     const data = await res.json();
     if(!S.hintsMap[sub.id]) S.hintsMap[sub.id] = [];
     if(!S.hintsMap[sub.id].some(h=>h.hint_level === data.hint_level)){
       S.hintsMap[sub.id].push(data);
     }
     toast(`Revealed Hint ${data.hint_level}: ${data.hint_type}`);
   }
 }catch(err){
   toast("Hint request error: " + err.message);
 }
 route();
}

 addEventListener('pointermove',e=>{m.x=e.clientX/innerWidth*2-1;m.y=-(e.clientY/innerHeight*2-1);},{passive:true});
 const kf=(dt,s)=>1-Math.exp(-dt*s);

 const mkR=(canvas,pr)=>{
   const r=new T.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});

 };
 const circle=R=>{
   const p=[];
   for(let i=0;i<128;i++){
     const a=i/128*Math.PI*2;
     p.push(new T.Vector3(Math.cos(a)*R,Math.sin(a)*R,0));
   }
   return new T.BufferGeometry().setFromPoints(p);
 };
 const visible=el=>{const b=el.getBoundingClientRect();return !(b.bottom<-60||b.top>innerHeight+60);};
 const scenes=[];
 const disposeScene=(sc,r,canvas)=>{

  r.dispose(); try{r.forceContextLoss();}catch(e){} if(canvas.id!=='bg3d') canvas.remove();
 };

  const sc=new T.Scene(), cam=new T.PerspectiveCamera(55,1,.1,100); cam.position.z=14;
  const world=new T.Group(); sc.add(world);
  const N=180, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const pal=[0xa88cff,0x64d8ec,0xf8c76c,0x6fe7a9].map(h=>new T.Color(h));
  for(let i=0;i<N;i++){
   pos[i*3]=(Math.random()-.5)*46; pos[i*3+1]=(Math.random()-.5)*32; pos[i*3+2]=(Math.random()-.5)*24-4;
   const c=pal[i%4]; col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const pg=new T.BufferGeometry(); pg.setAttribute('position',new T.BufferAttribute(pos,3)); pg.setAttribute('color',new T.BufferAttribute(col,3));
  const pts=new T.Points(pg,new T.PointsMaterial({size:.095,vertexColors:true,transparent:true,opacity:.7,depthWrite:false}));
  world.add(pts);
  const size=()=>{r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();};
  size(); addEventListener('resize',size);
  scenes.push({render(dt,t){
   pts.rotation.y=t*.015*MOT;
   world.rotation.y+=((m.sx*.12)-world.rotation.y)*kf(dt,2);
   world.rotation.x+=((-m.sy*.06)-world.rotation.x)*kf(dt,2);
   r.render(sc,cam);
  }});
 }

 /* ==========================================================================
    ADORABLE 3D BUG MASCOT (Cute Chibi Debugger Bug)
    - Chubby plump rounded body with creamy tummy patch
    - Giant expressive glossy anime eyes with double sparkle glints
    - Rosy glowing blushing cheeks and sweet little smile
    - Glossy candy coral ladybug shell with cute dark polka dots
    - Springy curly antennae with glowing pastel pom-pom bobbles that jiggle
    - Translucent fluttering fairy wings with cute shimmer
    - Tiny stubby paddling paws that wiggle in the air
    - Squash-and-stretch bouncy tickle physics on click
    - Orbiting magical star motes and sparkling rings
    ========================================================================== */
 function createCuteBug(){
  const bugGroup = new T.Group();

  // Premium Cute Materials
  const skinMat = new T.MeshStandardMaterial({
    color: 0xfff6ec,
    roughness: 0.22,
    metalness: 0.02
  });

  const bellyMat = new T.MeshStandardMaterial({
    color: 0xffe2ce,
    roughness: 0.3,
    metalness: 0.0
  });

  const shellMat = new T.MeshStandardMaterial({
    color: 0xff5454,
    emissive: 0x3d0c0c,
    emissiveIntensity: 0.35,
    roughness: 0.12,
    metalness: 0.05
  });

  const spotMat = new T.MeshStandardMaterial({
    color: 0x221730,
    roughness: 0.25,
    metalness: 0.02
  });

  const eyeWhiteMat = new T.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.08,
    metalness: 0.02
  });

  const eyePupilMat = new T.MeshStandardMaterial({
    color: 0x140d22,
    roughness: 0.05,
    metalness: 0.05
  });

  const eyeGlintMat = new T.MeshBasicMaterial({
    color: 0xffffff
  });

  const blushMat = new T.MeshStandardMaterial({
    color: 0xff8ca3,
    emissive: 0xff4d73,
    emissiveIntensity: 1.1,
    roughness: 0.4,
    transparent: true,
    opacity: 0.88
  });

  const bobbleMat = new T.MeshStandardMaterial({
    color: 0xffdb60,
    emissive: 0xffa826,
    emissiveIntensity: 1.8,
    roughness: 0.15,
    metalness: 0.1
  });

  const stalkMat = new T.MeshStandardMaterial({
    color: 0x3c2a52,
    roughness: 0.3,
    metalness: 0.1
  });

  const wingMat = new T.MeshStandardMaterial({
    color: 0xb5f3ff,
    emissive: 0x5ce1ff,
    emissiveIntensity: 0.8,
    roughness: 0.1,
    transparent: true,
    opacity: 0.58,
    side: T.DoubleSide,
    depthWrite: false
  });

  const pawMat = new T.MeshStandardMaterial({
    color: 0x362447,
    roughness: 0.3,
    metalness: 0.05
  });

  // 1. Chubby Main Body / Head Base
  const bodyGeo = new T.SphereGeometry(0.72, 32, 28);
  bodyGeo.scale(1.05, 0.95, 1.08);
  const bodyMesh = new T.Mesh(bodyGeo, skinMat);
  bugGroup.add(bodyMesh);

  // Soft Chubby Belly Patch
  const bellyGeo = new T.SphereGeometry(0.52, 24, 20);
  bellyGeo.scale(0.9, 0.85, 0.4);
  const bellyMesh = new T.Mesh(bellyGeo, bellyMat);
  bellyMesh.position.set(0, -0.16, 0.58);
  bugGroup.add(bellyMesh);

  // 2. Glossy Candy Ladybug Shell on Back
  const shellGroup = new T.Group();
  shellGroup.position.set(0, 0.12, -0.22);

  const shellGeo = new T.SphereGeometry(0.78, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.56);
  shellGeo.rotateX(-Math.PI / 1.55);
  shellGeo.scale(1.04, 0.96, 1.15);
  const shellMesh = new T.Mesh(shellGeo, shellMat);
  shellGroup.add(shellMesh);

  // Shell Seam Divider
  const seamGeo = new T.CylinderGeometry(0.018, 0.018, 1.2, 8);
  seamGeo.rotateX(Math.PI / 3);
  const seamMesh = new T.Mesh(seamGeo, spotMat);
  seamMesh.position.set(0, 0.28, -0.32);
  shellGroup.add(seamMesh);

  // Polka Dots on Shell
  const dotCoords = [
    [-0.38, 0.28, -0.25, 0.12],
    [ 0.38, 0.28, -0.25, 0.12],
    [-0.52, 0.05, -0.42, 0.14],
    [ 0.52, 0.05, -0.42, 0.14],
    [-0.24, 0.42, -0.58, 0.11],
    [ 0.24, 0.42, -0.58, 0.11]
  ];
  dotCoords.forEach(([dx, dy, dz, r]) => {
    const dotMesh = new T.Mesh(new T.SphereGeometry(r, 16, 14), spotMat);
    dotMesh.position.set(dx, dy, dz);
    dotMesh.scale.set(1.0, 0.4, 1.0);
    shellGroup.add(dotMesh);
  });

  // Glowing heart badge on shell
  const heartShape = new T.Shape();
  heartShape.moveTo(0, 0.06);
  heartShape.bezierCurveTo(0, 0.1, -0.08, 0.16, -0.14, 0.16);
  heartShape.bezierCurveTo(-0.2, 0.16, -0.22, 0.08, -0.22, 0.02);
  heartShape.bezierCurveTo(-0.22, -0.08, -0.08, -0.18, 0, -0.24);
  heartShape.bezierCurveTo(0.08, -0.18, 0.22, -0.08, 0.22, 0.02);
  heartShape.bezierCurveTo(0.22, 0.08, 0.2, 0.16, 0.14, 0.16);
  heartShape.bezierCurveTo(0.08, 0.16, 0, 0.1, 0, 0.06);

  const heartGeo = new T.ShapeGeometry(heartShape);
  heartGeo.scale(0.55, 0.55, 0.55);
  heartGeo.rotateX(-Math.PI / 3);
  const heartMesh = new T.Mesh(heartGeo, new T.MeshStandardMaterial({
    color: 0xffd43f,
    emissive: 0xffb700,
    emissiveIntensity: 1.5,
    side: T.DoubleSide
  }));
  heartMesh.position.set(0, 0.52, -0.45);
  shellGroup.add(heartMesh);

  bugGroup.add(shellGroup);

  // 3. Giant Sparkling Anime Eyes
  const eyesGroup = new T.Group();
  const leftEyeGroup = new T.Group();
  const rightEyeGroup = new T.Group();

  leftEyeGroup.position.set(-0.31, 0.14, 0.62);
  rightEyeGroup.position.set(0.31, 0.14, 0.62);

  [leftEyeGroup, rightEyeGroup].forEach((eg, i) => {
    const sign = i === 0 ? -1 : 1;
    eg.rotation.y = sign * 0.18;
    eg.rotation.x = -0.06;

    // Eye Sclera (White base)
    const sclera = new T.Mesh(new T.SphereGeometry(0.23, 28, 24), eyeWhiteMat);
    sclera.scale.set(1.0, 1.15, 0.85);
    eg.add(sclera);

    // Deep Glossy Pupil
    const pupil = new T.Mesh(new T.SphereGeometry(0.16, 24, 20), eyePupilMat);
    pupil.position.set(sign * 0.02, -0.01, 0.12);
    pupil.scale.set(0.95, 1.1, 0.6);
    eg.add(pupil);

    // Primary Big Glint (Sparkling highlight)
    const glint1 = new T.Mesh(new T.SphereGeometry(0.06, 12, 12), eyeGlintMat);
    glint1.position.set(sign * 0.03 + 0.04, 0.06, 0.19);
    eg.add(glint1);

    // Secondary Sub-glint
    const glint2 = new T.Mesh(new T.SphereGeometry(0.03, 10, 10), eyeGlintMat);
    glint2.position.set(sign * 0.03 - 0.04, -0.05, 0.19);
    eg.add(glint2);

    eyesGroup.add(eg);
  });
  bugGroup.add(eyesGroup);

  // 4. Rosy Cheeks (Blushing discs)
  const blushGeo = new T.SphereGeometry(0.12, 16, 14);
  blushGeo.scale(1.2, 0.6, 0.25);
  const blushL = new T.Mesh(blushGeo, blushMat);
  blushL.position.set(-0.46, -0.06, 0.58);
  blushL.rotation.y = -0.45;
  const blushR = new T.Mesh(blushGeo, blushMat);
  blushR.position.set(0.46, -0.06, 0.58);
  blushR.rotation.y = 0.45;
  bugGroup.add(blushL, blushR);

  // 5. Cute Smile `:3` Mouth
  const smileShape = new T.TorusGeometry(0.075, 0.018, 10, 24, Math.PI * 0.85);
  smileShape.rotateZ(Math.PI * 1.08);
  const smileMesh = new T.Mesh(smileShape, pawMat);
  smileMesh.position.set(0, -0.09, 0.76);
  bugGroup.add(smileMesh);

  // 6. Curly Springy Antennae with Glowing Bobbles
  const antennae = [];
  [-1, 1].forEach(side => {
    const antGroup = new T.Group();
    antGroup.position.set(side * 0.22, 0.62, 0.28);

    const curvePoints = [
      new T.Vector3(0, 0, 0),
      new T.Vector3(side * 0.08, 0.2, 0.02),
      new T.Vector3(side * 0.22, 0.38, -0.02),
      new T.Vector3(side * 0.28, 0.52, -0.08)
    ];
    const curve = new T.CatmullRomCurve3(curvePoints);
    const stemGeo = new T.TubeGeometry(curve, 18, 0.024, 8, false);
    const stemMesh = new T.Mesh(stemGeo, stalkMat);
    antGroup.add(stemMesh);

    const bobble = new T.Mesh(new T.SphereGeometry(0.12, 20, 20), bobbleMat);
    bobble.position.copy(curvePoints[3]);
    antGroup.add(bobble);

    const aura = new T.Mesh(new T.SphereGeometry(0.15, 14, 14), new T.MeshBasicMaterial({
      color: 0xffe285,
      transparent: true,
      opacity: 0.35
    }));
    bobble.add(aura);

    bugGroup.add(antGroup);
    antennae.push({ group: antGroup, side, baseRotZ: side * 0.1 });
  });

  // 7. Shimmering Translucent Fairy Wings
  const wings = [];
  [-1, 1].forEach(side => {
    const wingGroup = new T.Group();
    wingGroup.position.set(side * 0.16, 0.35, -0.16);

    const wingShape = new T.Shape();
    wingShape.moveTo(0, 0);
    wingShape.bezierCurveTo(side * 0.3, 0.4, side * 0.8, 0.6, side * 0.75, 0.15);
    wingShape.bezierCurveTo(side * 0.7, -0.15, side * 0.3, -0.2, 0, 0);

    const wingGeo = new T.ShapeGeometry(wingShape);
    const wingMesh = new T.Mesh(wingGeo, wingMat);
    wingGroup.add(wingMesh);

    const edgeGeo = new T.EdgesGeometry(wingGeo);
    const edgeLine = new T.LineSegments(edgeGeo, new T.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.75
    }));
    wingGroup.add(edgeLine);

    wingGroup.rotation.y = side * 0.3;
    wingGroup.rotation.x = -0.2;
    bugGroup.add(wingGroup);
    wings.push({ group: wingGroup, side });
  });

  // 8. Four Cute Stubby Paddling Paws
  const paws = [];
  const pawCoords = [
    [-0.38, -0.56,  0.22,  0.35, -0.25],
    [ 0.38, -0.56,  0.22, -0.35,  0.25],
    [-0.42, -0.56, -0.24,  0.45, -0.35],
    [ 0.42, -0.56, -0.24, -0.45,  0.35]
  ];

  pawCoords.forEach(([px, py, pz, rotZ, rotY], idx) => {
    const pawGroup = new T.Group();
    pawGroup.position.set(px, py, pz);

    const pawGeo = new T.SphereGeometry(0.14, 18, 14);
    pawGeo.scale(1.0, 0.8, 1.3);
    const pawMesh = new T.Mesh(pawGeo, pawMat);
    pawMesh.rotation.z = rotZ;
    pawMesh.rotation.y = rotY;
    pawGroup.add(pawMesh);

    const pad = new T.Mesh(new T.SphereGeometry(0.065, 12, 12), blushMat);
    pad.position.set(0, -0.06, 0.04);
    pad.scale.set(1.1, 0.3, 1.1);
    pawMesh.add(pad);

    bugGroup.add(pawGroup);
    paws.push({ group: pawGroup, idx, baseRotZ: rotZ });
  });

  return {
    group: bugGroup,
    antennae,
    wings,
    paws,
    eyesGroup,
    leftEyeGroup,
    rightEyeGroup,
    update(t, dt, squish) {
      bugGroup.position.y = Math.sin(t * 2.4) * 0.12;
      bugGroup.rotation.z = Math.sin(t * 1.6) * 0.04;
      bugGroup.rotation.x = Math.sin(t * 1.8) * 0.03;

      antennae.forEach(ant => {
        ant.group.rotation.z = ant.baseRotZ + Math.sin(t * 5 + ant.side) * 0.12 + squish * ant.side * 0.4;
        ant.group.rotation.x = Math.cos(t * 4.2 + ant.side) * 0.08;
      });

      wings.forEach(w => {
        w.group.rotation.y = w.side * (0.35 + Math.sin(t * 28) * 0.42);
        w.group.rotation.z = Math.sin(t * 24) * 0.12;
      });

      paws.forEach(p => {
        p.group.rotation.x = Math.sin(t * 3.5 + p.idx * 1.5) * 0.18;
        p.group.position.y = -0.56 + Math.cos(t * 3.5 + p.idx * 1.5) * 0.03;
      });

      if (squish > 0) {
        const sY = 1.0 - squish * 0.32;
        const sXZ = 1.0 + squish * 0.22;
        bugGroup.scale.set(1.15 * sXZ, 1.15 * sY, 1.15 * sXZ);
        leftEyeGroup.scale.y = Math.max(0.2, 1.0 - squish * 0.85);
        rightEyeGroup.scale.y = Math.max(0.2, 1.0 - squish * 0.85);
      } else {
        bugGroup.scale.setScalar(1.15);
        leftEyeGroup.scale.y = 1.0;
        rightEyeGroup.scale.y = 1.0;
      }
    }
  };
 }

 /* Hero 3D Stage with Cute Bug Mascot, Fairy Halos & Sparkling Star Motes */
 function hero(el){
  if(!el) return;
  const canvas=document.createElement('canvas'); el.insertBefore(canvas,el.firstChild);
  let r; try{r=mkR(canvas,1.75);}catch(e){canvas.remove();return;}
  const sc=new T.Scene(), cam=new T.PerspectiveCamera(36,1,.1,60);
  cam.position.set(0,.4,9.2); cam.lookAt(0,0,0);

  // Studio lighting: warm key, soft violet fill, turquoise rim
  sc.add(new T.AmbientLight(0xfff0ea,.85));
  const key=new T.DirectionalLight(0xffeedd,1.5); key.position.set(3,5,6); sc.add(key);
  const rim=new T.PointLight(0x64d8ec,2.0,22); rim.position.set(-5,-2,4); sc.add(rim);
  const warm=new T.PointLight(0xff8878,1.6,18); warm.position.set(4,-3,2); sc.add(warm);

  const root=new T.Group(); sc.add(root);

  // Soft Floating Bubble / Fairy Halo Rings
  const ring1=new T.LineLoop(circle(2.6),new T.LineBasicMaterial({color:0x64d8ec,transparent:true,opacity:.5}));
  const ring2=new T.LineLoop(circle(3.1),new T.LineBasicMaterial({color:0xa88cff,transparent:true,opacity:.55}));
  const ring3=new T.LineLoop(circle(3.6),new T.LineBasicMaterial({color:0xf8c76c,transparent:true,opacity:.4}));
  ring1.rotation.x=Math.PI/3.2; ring2.rotation.y=Math.PI/4.2; ring3.rotation.z=Math.PI/5.5;
  root.add(ring1,ring2,ring3);

  // Cute Chibi Bug Instance
  const cuteBug = createCuteBug();
  cuteBug.group.scale.setScalar(1.15);
  root.add(cuteBug.group);

  // Orbiting Little Stars / Fairy Dust Pearls
  const stars = [];
  const sColors = [0xffd700, 0x64d8ec, 0xff8fa3, 0xa88cff];
  for (let i = 0; i < 4; i++) {
    const sMesh = new T.Mesh(
      new T.OctahedronGeometry(0.1, 0),
      new T.MeshStandardMaterial({ color: sColors[i], emissive: sColors[i], emissiveIntensity: 2.2 })
    );
    root.add(sMesh);
    stars.push({ mesh: sMesh, angle: (i / 4) * Math.PI * 2, radius: 2.4, speed: 0.8 + i * 0.15, tilt: i * 0.7 });
  }

  // Swirling Fairy Sparkle Motes (140 particles)
  const vCount=140, vPos=new Float32Array(vCount*3), vCol=new Float32Array(vCount*3);
  const vColors=[new T.Color(0xffdb60), new T.Color(0x64d8ec), new T.Color(0xff8ca3), new T.Color(0xa88cff)];
  for(let i=0;i<vCount;i++){
    const ang=(i/vCount)*Math.PI*4;
    const rad=1.9+Math.sin(i*0.45)*0.9;
    vPos[i*3]=Math.cos(ang)*rad;
    vPos[i*3+1]=((i/vCount)-0.5)*3.2;
    vPos[i*3+2]=Math.sin(ang)*rad;
    const col=vColors[i%4];
    vCol[i*3]=col.r; vCol[i*3+1]=col.g; vCol[i*3+2]=col.b;
  }
  const vGeo=new T.BufferGeometry();
  vGeo.setAttribute('position',new T.BufferAttribute(vPos,3));
  vGeo.setAttribute('color',new T.BufferAttribute(vCol,3));
  const vPts=new T.Points(vGeo,new T.PointsMaterial({
    size:.095,
    vertexColors:true,
    transparent:true,
    opacity:.85,
    blending:T.AdditiveBlending,
    depthWrite:false
  }));
  root.add(vPts);

  // Tickle Ripple Rings on Click
  const shockGeo=new T.RingGeometry(.2,.32,64);
  const shockMat=new T.MeshBasicMaterial({color:0xff8fa3,transparent:true,opacity:0,side:T.DoubleSide});
  const shockwave=new T.Mesh(shockGeo,shockMat);
  sc.add(shockwave);

  const shockGeo2=new T.RingGeometry(.1,.18,64);
  const shockMat2=new T.MeshBasicMaterial({color:0x64d8ec,transparent:true,opacity:0,side:T.DoubleSide});
  const shockwave2=new T.Mesh(shockGeo2,shockMat2);
  sc.add(shockwave2);

  const st={ry:.5,rx:.1,vel:0,drag:false,lx:0,ly:0,squish:0,shockScale:1};
  canvas.addEventListener('pointerdown',e=>{
    st.drag=true; st.lx=e.clientX; st.ly=e.clientY;
    st.squish=1.0; st.shockScale=.2;
    shockMat.opacity=.95; shockMat2.opacity=1.0;
    try{canvas.setPointerCapture(e.pointerId);}catch(x){}
  });
  canvas.addEventListener('pointermove',e=>{
    if(!st.drag) return;
    const dx=e.clientX-st.lx, dy=e.clientY-st.ly; st.lx=e.clientX; st.ly=e.clientY;
    st.ry+=dx*.008; st.rx=clamp(st.rx+dy*.006,-.8,.8);
  });
  canvas.addEventListener('pointerup',()=>{st.drag=false;});

  const ro=new ResizeObserver(()=>{
   const w=el.clientWidth,h=el.clientHeight; if(!w||!h) return;
   r.setSize(w,h,false); cam.aspect=w/h; cam.position.z=Math.max(9.2,3.4/(Math.tan(18*Math.PI/180)*cam.aspect)); cam.updateProjectionMatrix();
  }); ro.observe(el);

  scenes.push({temp:true,
   dispose(){ro.disconnect();disposeScene(sc,r,canvas);},
   render(dt,t){
    if(!visible(el)) return;
    if(!st.drag){ st.ry+=.22*dt*MOT; }
    root.rotation.y=st.ry+m.sx*.22; root.rotation.x=st.rx-m.sy*.1;
    ring1.rotation.z+=dt*.35*MOT; ring2.rotation.x+=dt*.28*MOT; ring3.rotation.y+=dt*.2*MOT;
    vPts.rotation.y-=dt*.4*MOT;

    // Orbiting Stars
    stars.forEach(s => {
      s.angle += dt * s.speed * MOT;
      s.mesh.position.set(
        Math.cos(s.angle) * s.radius,
        Math.sin(s.angle * 1.4) * 0.8 + Math.sin(s.tilt),
        Math.sin(s.angle) * s.radius
      );
      s.mesh.rotation.x += dt * 2.5; s.mesh.rotation.y += dt * 3.0;
    });

    // Squash & Stretch Tickle Physics
    if(st.squish>0){
      st.squish=Math.max(0,st.squish-dt*2.2);
    }
    const squishFactor = st.squish > 0 ? Math.sin(st.squish * Math.PI) * Math.exp(-st.squish * 1.5) : 0;

    // Update Cute Bug Animations
    cuteBug.update(t, dt, squishFactor);

    if(shockMat.opacity>0){
      st.shockScale+=dt*5.5;
      shockwave.scale.set(st.shockScale,st.shockScale,1);
      shockMat.opacity=Math.max(0,shockMat.opacity-dt*1.6);
      shockwave2.scale.set(st.shockScale * 0.75, st.shockScale * 0.75, 1);
      shockMat2.opacity=Math.max(0,shockMat2.opacity-dt*1.8);
    }
    r.render(sc,cam);
   }});
 }

 /* Dashboard Concept Mastery Sky Scene */
 function sky(el,data){

   const geo=new T.BoxGeometry(.78,1,.78); geo.translate(0,.5,0);
   const mat=new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.16,roughness:.35,metalness:.1});
   const mesh=new T.Mesh(geo,mat); mesh.position.set(x,0,z); mesh.scale.y=Math.max(.1, d.val/100*2.8);
   g.add(mesh); pillars.push(mesh);
  });
  const ro=new ResizeObserver(()=>{
   const w=el.clientWidth,h=el.clientHeight; if(!w||!h) return;
   r.setSize(w,h,false); cam.aspect=w/h; cam.position.set(0,4.8,8.5); cam.lookAt(0,.8,0); cam.updateProjectionMatrix();
  }); ro.observe(el);

  scenes.push({temp:true,
   dispose(){ro.disconnect();disposeScene(sc,r,canvas);},
   render(dt,t){
    if(!visible(el)) return;
    g.rotation.y+=.1*dt*MOT;
    r.render(sc,cam);
   }});
 }

 function init(){
  bg();
  let last=performance.now();
  const frame=now=>{
   requestAnimationFrame(frame);
   const dt=Math.min(.05,(now-last)/1000); last=now;
   const k=kf(dt,3); m.sx+=(m.x-m.sx)*k; m.sy+=(m.y-m.sy)*k;
   for(const s of scenes) s.render(dt,performance.now()/1000);
  };
  requestAnimationFrame(frame);
 }
 function unmount(){
  for(let i=scenes.length-1;i>=0;i--){ if(scenes[i].temp){ try{scenes[i].dispose();}catch(e){} scenes.splice(i,1); } }
 }
 return {init,hero,sky,unmount};
})();

GL.init();
fetchProfile();
route();
</script>
